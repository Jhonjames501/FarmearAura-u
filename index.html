<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmear Aura PRO - Edición Sigma</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
        }
        body {
            background-color: #050505;
            color: #eee;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            background-image: linear-gradient(0deg, #1a1a1a 0%, #050505 100%);
        }
        .main-layout {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 450px;
            padding: 20px;
        }

        /* Sección del Personaje / Emoji */
        .character-display {
            background: #111;
            border: 3px solid #d4af37;
            border-radius: 16px;
            height: 180px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: 0 0 15px rgba(212, 175, 55, 0.3);
        }
        .avatar-emoji {
            font-size: 75px;
            transition: transform 0.2s ease;
        }
        .avatar-emoji:hover {
            transform: scale(1.1);
        }
        .rank-tag {
            position: absolute;
            top: 10px;
            left: 10px;
            background: #d4af37;
            color: #050505;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: bold;
            text-transform: uppercase;
        }

        /* Sección de Stats */
        .stats-panel {
            background: #111;
            border: 2px solid #444;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
        }
        .aura-counter {
            font-size: 48px;
            font-weight: bold;
            color: #00ff00;
            margin: 10px 0;
            text-shadow: 0 0 8px rgba(0, 255, 0, 0.6);
        }

        /* Botón Principal */
        .action-btn {
            width: 100%;
            padding: 20px;
            background: linear-gradient(90deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #9400d3);
            background-size: 200% 100%;
            animation: gradientAnimation 3s linear infinite;
            border: none;
            color: white;
            font-weight: bold;
            font-size: 18px;
            border-radius: 12px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.3);
        }
        .action-btn:active {
            transform: translateY(2px);
            box-shadow: none;
        }

        @keyframes gradientAnimation {
            0% { background-position: 100% 0%; }
            100% { background-position: -100% 0%; }
        }

        /* Tienda de Estilo */
        .shop-panel {
            background: #161616;
            border: 1px dashed #d4af37;
            border-radius: 16px;
            padding: 15px;
        }
        .shop-title {
            color: #d4af37;
            font-size: 12px;
            text-align: center;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .shop-items {
            display: flex;
            gap: 8px;
            justify-content: center;
        }
        .shop-item {
            background: #222;
            border-radius: 8px;
            padding: 8px;
            width: 110px;
            text-align: center;
            font-size: 9px;
            border: 1px solid #333;
            opacity: 0.5;
        }
        .shop-item.unlocked {
            opacity: 1;
            border-color: #d4af37;
            background: #252210;
        }
        .shop-icon {
            font-size: 24px;
            margin-bottom: 4px;
        }
    </style>
</head>
<body>

    <div class="main-layout">
        
        <!-- VISTA DEL PERSONAJE -->
        <div class="character-display">
            <div class="rank-tag" id="rangoEtiqueta">NPC Beta</div>
            <div class="avatar-emoji" id="imagenPersonaje">💀</div>
        </div>

        <!-- VISTA DE DATOS -->
        <div class="stats-panel">
            <div class="aura-counter" id="puntosAura">0</div>
            <p style="font-size: 11px; color: #888;">PUNTOS DE AURA ACUMULADOS</p>
        </div>

        <!-- BOTÓN DE ACCIÓN -->
        <button class="action-btn" id="btnFarmear">✨ FARMEAR AURA ✨</button>

        <!-- TIENDA / MEJORAS -->
        <div class="shop-panel">
            <h3 class="shop-title">Tienda de Estilo Sigma</h3>
            <div class="shop-items">
                <div class="shop-item" id="shopLentes">
                    <div class="shop-icon">🕶️</div>
                    <p>Lentes Oscuros (1,000 Aura)</p>
                </div>
                <div class="shop-item" id="shopCorte">
                    <div class="shop-icon">✂️</div>
                    <p>Corte Fade Pro (5,000 Aura)</p>
                </div>
                <div class="shop-item" id="shopCadenita">
                    <div class="shop-icon">⛓️</div>
                    <p>Cadenita de Oro (10,000 Aura)</p>
                </div>
            </div>
        </div>

    </div>

    <script>
        let aura = 0;
        let rangoActual = "NPC Beta";

        const btnFarmear = document.getElementById("btnFarmear");
        const puntosAura = document.getElementById("puntosAura");
        const rangoEtiqueta = document.getElementById("rangoEtiqueta");
        const imagenPersonaje = document.getElementById("imagenPersonaje");
        
        const shopLentes = document.getElementById("shopLentes");
        const shopCorte = document.getElementById("shopCorte");
        const shopCadenita = document.getElementById("shopCadenita");

        // Configuración de rangos con emojis dinámicos
        const nivelesConfig = [
            { auraMin: 0, nombre: "NPC Beta", emoji: "💀" },
            { auraMin: 100, nombre: "Sigma Male", emoji: "🗿" },
            { auraMin: 500, nombre: "Gigachad", emoji: "💪" },
            { auraMin: 2000, nombre: "Patrick Bateman", emoji: "🕴️" },
            { auraMin: 10000, nombre: "Dios del Aura Pura", emoji: "👑" }
        ];

        btnFarmear.addEventListener("click", () => {
            let ganado = Math.floor(Math.random() * 20) + 5;
            aura += ganado;

            actualizarJuego();
            animarBoton();
        });

        function actualizarJuego() {
            puntosAura.textContent = aura;

            let nivelActualConfig = nivelesConfig[0];

            for (let i = 0; i < nivelesConfig.length; i++) {
                if (aura >= nivelesConfig[i].auraMin) {
                    nivelActualConfig = nivelesConfig[i];
                } else {
                    break;
                }
            }

            rangoActual = nivelActualConfig.nombre;
            rangoEtiqueta.textContent = rangoActual;
            imagenPersonaje.textContent = nivelActualConfig.emoji;

            // Desbloqueo visual de la tienda
            if(aura >= 1000) shopLentes.classList.add('unlocked');
            if(aura >= 5000) shopCorte.classList.add('unlocked');
            if(aura >= 10000) shopCadenita.classList.add('unlocked');
        }

        function animarBoton() {
            btnFarmear.style.transform = 'scale(0.95)';
            setTimeout(() => {
                btnFarmear.style.transform = 'scale(1)';
            }, 100);
        }

        actualizarJuego();
    </script>

</body>
</html>
