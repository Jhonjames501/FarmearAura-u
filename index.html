<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Peruvian Motero Hero</title>
<style>
 body{margin:0;background:#F2D6A6;display:grid;place-items:center;height:100vh;font-family:system-ui}
 canvas{background:linear-gradient(#87CEEB 0%, #F2D6A6 60%);border:4px solid #8B4513;border-radius:12px;box-shadow:0 10px 30px #0005}
 #hud{position:absolute;top:10px;font-weight:900;color:#5D4037}
</style>
</head>
<body>
<div id="hud">🪙 <span id="coins">0</span> | ❤️ <span id="life">3</span></div>
<canvas id="g" width="800" height="400"></canvas>
<script>
const c=document.getElementById('g'),x=c.getContext('2d');
let coins=0,life=3, hero={x:100,y:280,w:60,h:40,vy:0,onGround:true};
let keys={}, obstacles=[], coinList=[], py=280;
let frame=0;

function spawn(){
 if(Math.random()<0.03){
  let type=['cactus','mummy','scorpion'][Math.floor(Math.random()*3)];
  obstacles.push({x:800,y:py,type,w:40,h:50});
 }
 if(Math.random()<0.04) coinList.push({x:800,y:py-60,w:30,h:30,taken:false});
}
function drawHero(){
 x.fillStyle='#FF6F00'; x.fillRect(hero.x,hero.y,hero.w,hero.h/2); // moto
 x.fillStyle='#C62828'; x.fillRect(hero.x+10,hero.y-20,30,20); // chullo
 x.fillStyle='#FFCC80'; x.fillRect(hero.x+15,hero.y-10,20,10);
}
function drawObs(o){
 if(o.type=='cactus'){x.fillStyle='#2E7D32'; x.fillRect(o.x,o.y,o.w,o.h); x.fillStyle='#1B5E20'; x.fillRect(o.x-5,o.y+10,10,10); x.fillRect(o.x+35,o.y+10,10,10);}
 if(o.type=='mummy'){x.fillStyle='#D7CCC8'; x.fillRect(o.x,o.y,o.w,o.h); x.fillStyle='#8D6E63'; x.fillRect(o.x+5,o.y-10,30,10);}
 if(o.type=='scorpion'){x.fillStyle='#FFA000'; x.fillRect(o.x,o.y,o.w,o.h); x.beginPath(); x.arc(o.x+20,o.y-10,15,0,6); x.fill();}
}
function loop(){
 frame++; x.clearRect(0,0,800,400);
 // piso
 x.fillStyle='#8D6E63'; x.fillRect(0,330,800,70);
 x.fillStyle='#A1887F'; for(let i=0;i<800;i+=40) x.fillRect(i,330,20,20);
 
 spawn();
 // gravedad
 if(!hero.onGround){hero.vy+=0.8; hero.y+=hero.vy; if(hero.y>=280){hero.y=280; hero.onGround=true; hero.vy=0;}}
 if((keys[' ']||keys['w']||keys['ArrowUp'])&&hero.onGround){hero.vy=-14; hero.onGround=false;}

 // mover obstáculos
 obstacles.forEach(o=>{o.x-=5; drawObs(o);
  if(hero.x<o.x+o.w && hero.x+hero.w>o.x && hero.y<o.y+o.h && hero.y+hero.h>o.y){o.x=-100; life--; document.getElementById('life').textContent=life; if(life<=0) location.reload();}
 });
 coinList.forEach(co=>{co.x-=5; if(!co.taken){x.fillStyle='gold'; x.beginPath(); x.arc(co.x+15,co.y+15,14,0,6); x.fill(); x.fillStyle='#000'; x.fillText('★',co.x+7,co.y+20); if(hero.x<co.x+co.w&&hero.x+hero.w>co.x&&hero.y<co.y+co.h&&hero.y+hero.h>co.y){co.taken=true; coins++; document.getElementById('coins').textContent=coins;}}});
 
 drawHero();
 obstacles=obstacles.filter(o=>o.x>-100);
 coinList=coinList.filter(c=>!c.taken&&c.x>-100);
 requestAnimationFrame(loop);
}
addEventListener('keydown',e=>keys[e.key]=true);
addEventListener('keyup',e=>keys[e.key]=false);
c.addEventListener('touchstart',()=>{if(hero.onGround){hero.vy=-14; hero.onGround=false;}});
loop();
</script>
</body>
</html>
