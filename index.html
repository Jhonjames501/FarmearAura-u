<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmear Aura: Edición Definitiva</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #030303;
            color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            background-image: radial-gradient(circle at center, #151515 0%, #030303 100%);
            padding-bottom: 30px;
        }
        .main-layout {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 420px;
            padding: 15px;
        }
        .card {
            background: #111;
            border: 2px solid #d4af37;
            border-radius: 14px;
            padding: 15px;
            text-align: center;
        }
        h2 { color: #d4af37; font-size: 13px; margin-bottom: 8px; text-transform: uppercase; }
        input {
            width: 100%;
            padding: 10px;
            background: #222;
            border: 1px solid #444;
            color: #fff;
            border-radius: 8px;
            font-size: 15px;
            margin-bottom: 8px;
            text-align: center;
            letter-spacing: 2px;
        }
        .btn {
            width: 100%;
            padding: 10px;
            background: #d4af37;
            color: #030303;
            border: none;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 11px;
        }
        .btn-green { background: #00ff66; }
        .btn-pink { background: #ff0055; color: white; }

        /* Selector de avatares */
        .avatar-selector {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 8px;
        }
        .avatar-opcion {
            font-size: 20px;
            background: #222;
            border: 1px solid #444;
            padding: 5px 8px;
            border-radius: 6px;
            cursor: pointer;
        }
        .avatar-opcion.activo { border-color: #00ff66; background: #152215; }

        /* Animaciones de personaje */
        .npc-box {
            font-size: 45px;
            margin: 5px 0;
            transition: transform 0.1s ease;
            display: inline-block;
        }
        @keyframes auraHit {
            0% { transform: scale(1) rotate(0deg); filter: drop-shadow(0 0 0px #00ff66); }
            50% { transform: scale(1.25) rotate(-5deg); filter: drop-shadow(0 0 20px #00ff66) brightness(1.5); }
            100% { transform: scale(1) rotate(0deg); filter: drop-shadow(0 0 5px #00ff66); }
        }
        .animar-golpe { animation: auraHit 0.2s ease-in-out; }

        @keyframes powerVibrate {
            0% { transform: translate(0, 0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(2px, -2px); }
            60% { transform: translate(-1px, -1px); }
            80% { transform: translate(1px, 1px); }
            100% { transform: translate(0, 0); }
        }
        .animar-vibracion { animation: powerVibrate 0.15s infinite; }

        .energy-container {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 8px;
            margin-bottom: 8px;
            text-align: left;
        }
        .energy-label { font-size: 10px; color: #aaa; margin-bottom: 4px; display: flex; justify-content: space-between; }
        .energy-bar-bg { width: 100%; background: #333; height: 8px; border-radius: 4px; overflow: hidden; }
        .energy-bar-fill { width: 100%; background: linear-gradient(90deg, #ffcc00, #00ff66); height: 100%; transition: width 0.1s; }

        .score-display {
            background: #1a1a1a;
            border: 1px solid #444;
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 8px;
        }
        .score-number { font-size: 24px; color: #00ff66; font-weight: bold; }
        .score-title { font-size: 9px; color: #aaa; text-transform: uppercase; margin-top: 2px; }

        .action-btn {
            width: 100%;
            padding: 16px;
            border: none;
            font-weight: bold;
            border-radius: 12px;
            font-size: 14px;
            cursor: pointer;
            text-transform: uppercase;
            background: linear-gradient(90deg, #ff0055, #7a00ff, #00ffcc);
            color: white;
            box-shadow: 0 4px 15px rgba(122, 0, 255, 0.4);
            margin-bottom: 8px;
        }
        .action-btn:active { transform: scale(0.94); }
        .action-btn:disabled { background: #444; color: #888; box-shadow: none; cursor: not-allowed; }

        /* Tienda de mejoras funcional */
        .store-box {
            display: flex;
            justify-content: space-between;
            gap: 5px;
            background: #1a1a1a;
            border: 1px dashed #555;
            padding: 6px;
            border-radius: 10px;
            font-size: 9px;
        }
        .store-item { 
            background: #222; 
            padding: 6px 4px; 
            border-radius: 6px; 
            flex: 1; 
            text-align: center; 
            border: 1px solid #333; 
            cursor: pointer;
            color: #ccc;
        }
        .store-item:hover { border-color: #d4af37; color: #fff; }
        
        .multiplayer-status { font-size: 10px; color: #00ff66; margin-top: 5px; font-style: italic; }

        .aura-flotante {
            position: absolute;
            color: #00ff66;
            font-weight: bold;
            font-size: 15px;
            pointer-events: none;
            animation: subirTexto 0.5s ease-out forwards;
        }
        @keyframes subirTexto {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-35px) scale(1.3); }
        }
    </style>
</head>
<body>

    <div class="main-layout">
        
        <!-- SECCIÓN 1: CONEXIÓN ONLINE -->
        <div class="card">
            <h2>🌐 Multijugador Online</h2>
            <button class="btn btn-green" id="crearSalaBtn">Generar mi Código</button>
            <p id="myIdText" style="font-size: 12px; color: #00ff66; font-weight: bold; margin: 6px 0;">Código: ------</p>
            
            <hr style="border: 0.5px solid #333; margin: 6px 0;">
            
            <input type="text" id="codigoRivalInput" placeholder="Código de tu amigo" maxlength="6">
            <button class="btn btn-pink" id="unirseSalaBtn">Conectarme</button>
            <p id="connectionStatus" style="font-size: 10px; color: #aaa; margin-top: 4px;">Estado: Desconectado</p>
        </div>

        <!-- SECCIÓN 2: JUEGO CON TODAS LAS FUNCIONES -->
        <div class="card" style="border-color: #ff0055; position: relative;">
            <h2>Selecciona tu Avatar</h2>
            <div class="avatar-selector">
                <div class="avatar-opcion activo" onclick="cambiarAvatar('🧟', this)">🧟</div>
                <div class="avatar-opcion" onclick="cambiarAvatar('🗿', this)">🗿</div>
                <div class="avatar-opcion" onclick="cambiarAvatar('🔥', this)">🔥</div>
                <div class="avatar-opcion" onclick="cambiarAvatar('⚡', this)">⚡</div>
            </div>
            
            <div class="npc-box" id="npcAvatar">🧟</div>

            <!-- Barra de Estamina Real -->
            <div class="energy-container">
                <div class="energy-label">
                    <span>⚡ ESTAMINA</span>
                    <span id="energyText">100%</span>
                </div>
                <div class="energy-bar-bg">
                    <div class="energy-bar-fill" id="energyFill"></div>
                </div>
            </div>

            <!-- Puntuaciones -->
            <div class="score-display">
                <div class="score-number" id="scoreP1">0</div>
                <div class="score-title">Tus Puntos (<span id="multiplicadorText">+1 por toque</span>)</div>
                <hr style="border:0.5px solid #333; margin: 6px 0;">
                <div style="font-size: 13px; color: #ff0055; font-weight: bold;" id="scoreP2">0</div>
                <div class="score-title">Puntos del Rival</div>
            </div>

            <!-- Botón de Farmear -->
            <button class="action-btn" id="btnFarmear">🔥 Farmear Aura 🔥</button>

            <!-- Tienda Funcional -->
            <div class="store-box">
                <div class="store-item" onclick="comprarMejora(500, 2, 'Lentes')">👓 Lentes<br><b>500 pts (+2)</b></div>
                <div class="store-item" onclick="comprarMejora(3000, 5, 'Corte')">✂️ Corte<br><b>3k pts (+5)</b></div>
                <div class="store-item" onclick="comprarMejora(10000, 15, 'Gym')">🧬 Gym<br><b>10k pts (+15)</b></div>
            </div>

            <div class="multiplayer-status" id="multiplayerStatus">¡Todo listo para la batalla real!</div>
        </div>

    </div>

    <script>
        let peer, conn;
        let score1 = 0, score2 = 0;
        let estamina = 100;
        let multiplicador = 1;
        let codigoPersonal = "";
        let estaCansado = false;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function reproducirSonido(frecuencia, tipo, duracion) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = tipo;
            osc.frequency.value = frecuencia;
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duracion);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duracion);
        }

        function cambiarAvatar(emoji, el) {
            document.querySelectorAll('.avatar-opcion').forEach(e => e.classList.remove('activo'));
            el.classList.add('activo');
            document.getElementById("npcAvatar").textContent = emoji;
            reproducirSonido(600, 'sine', 0.1);
        }

        function comprarMejora(costo, multValor, nombre) {
            if (score1 >= costo) {
                score1 -= costo;
                multiplicador = multValor;
                document.getElementById("scoreP1").textContent = score1;
                document.getElementById("multiplicadorText").textContent = `+${multiplicador} por toque`;
                reproducirSonido(880, 'triangle', 0.3);
                alert(`¡Has comprado ${nombre}! Tus puntos por toque subieron a +${multiplicador}`);
                if (conn && conn.open) conn.send({score: score1});
            } else {
                reproducirSonido(150, 'sawtooth', 0.2);
                alert("¡Te faltan puntos de aura para esta mejora!");
            }
        }

        function generarCodigo6Digitos() {
            return Math.floor(100000 + Math.random() * 900000).toString();
        }

        document.getElementById("crearSalaBtn").addEventListener("click", () => {
            codigoPersonal = generarCodigo6Digitos();
            document.getElementById("myIdText").textContent = "Código: " + codigoPersonal;
            document.getElementById("crearSalaBtn").disabled = true;
            document.getElementById("crearSalaBtn").style.opacity = "0.5";

            peer = new Peer("sigma-" + codigoPersonal);
            peer.on('open', () => document.getElementById("connectionStatus").textContent = "Estado: Esperando rival...");
            peer.on('connection', (connection) => {
                conn = connection;
                setupConnection();
                document.getElementById("connectionStatus").textContent = "Estado: ¡Rival conectado!";
                document.getElementById("multiplayerStatus").textContent = "¡Partida en curso!";
                document.getElementById("npcAvatar").classList.add("animar-vibracion");
            });
        });

        document.getElementById("unirseSalaBtn").addEventListener("click", () => {
            let codigoAmigo = document.getElementById("codigoRivalInput").value.trim();
            if (codigoAmigo.length !== 6) { alert("Ingresa un código de 6 dígitos."); return; }
            if (!peer) peer = new Peer();
            document.getElementById("connectionStatus").textContent = "Estado: Conectando...";
            peer.on('open', () => {
                conn = peer.connect("sigma-" + codigoAmigo);
                setupConnection();
            });
        });

        function setupConnection() {
            conn.on('open', () => {
                document.getElementById("connectionStatus").textContent = "Estado: ¡Conectado con éxito!";
                document.getElementById("multiplayerStatus").textContent = "¡Partida en curso!";
                document.getElementById("npcAvatar").classList.add("animar-vibracion");
            });
            conn.on('data', (data) => {
                if(data.score !== undefined) {
                    score2 = data.score;
                    document.getElementById("scoreP2").textContent = score2;
                    let npc = document.getElementById("npcAvatar");
                    npc.classList.add("animar-golpe");
                    setTimeout(() => npc.classList.remove("animar-golpe"), 200);
                    verificarGanador();
                }
            });
        }

        const btnFarmear = document.getElementById("btnFarmear");
        const npcAvatar = document.getElementById("npcAvatar");

        btnFarmear.addEventListener("click", (e) => {
            if (estaCansado) return;

            score1 += multiplicador;
            document.getElementById("scoreP1").textContent = score1;

            reproducirSonido(350 + (multiplicador * 20), 'square', 0.1);

            npcAvatar.classList.remove("animar-golpe");
            void npcAvatar.offsetWidth;
            npcAvatar.classList.add("animar-golpe");

            crearTextoFlotante(e, `+${multiplicador} AURA`);

            // Gastar estamina
            estamina -= 4;
            if (estamina <= 0) {
                estamina = 0;
                estaCansado = true;
                btnFarmear.disabled = true;
                btnFarmear.textContent = "💤 ¡CANSADO! (Espera)...";
                reproducirSonido(100, 'sawtooth', 0.4);
                setTimeout(() => {
                    estamina = 100;
                    estaCansado = false;
                    btnFarmear.disabled = false;
                    btnFarmear.textContent = "🔥 Farmear Aura 🔥";
                }, 2000);
            }
            document.getElementById("energyFill").style.width = estamina + "%";
            document.getElementById("energyText").textContent = estamina + "%";

            if (conn && conn.open) {
                conn.send({score: score1});
            }
            verificarGanador();
        });

        function crearTextoFlotante(e, texto) {
            let el = document.createElement("div");
            el.className = "aura-flotante";
            el.textContent = texto;
            let rect = btnFarmear.getBoundingClientRect();
            el.style.left = (rect.left + rect.width / 2 + (Math.random() * 30 - 15)) + "px";
            el.style.top = rect.top + "px";
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 500);
        }

        function verificarGanador() {
            if (score1 >= 100) {
                reproducirSonido(700, 'sine', 0.5);
                alert("¡Has ganado la batalla de aura con gloria!");
                reiniciar();
            } else if (score2 >= 100) {
                reproducirSonido(120, 'sawtooth', 0.6);
                alert("¡Tu rival te ha aplastado en aura!");
                reiniciar();
            }
        }

        function reiniciar() {
            score1 = 0; score2 = 0;
            document.getElementById("scoreP1").textContent = 0;
            document.getElementById("scoreP2").textContent = 0;
            estamina = 100; multiplicador = 1;
            document.getElementById("multiplicadorText").textContent = "+1 por toque";
            document.getElementById("energyFill").style.width = "100%";
            document.getElementById("energyText").textContent = "100%";
            npcAvatar.classList.remove("animar-vibracion");
        }
    </script>
</body>
</html>
