<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmear Aura: Multijugador Online</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #030303;
            color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            background-image: radial-gradient(circle at center, #151515 0%, #030303 100%);
            padding-bottom: 30px;
        }
        .main-layout {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 420px;
            padding: 15px;
        }
        .card {
            background: #111;
            border: 2px solid #d4af37;
            border-radius: 14px;
            padding: 15px;
            text-align: center;
        }
        h2 { color: #d4af37; font-size: 15px; margin-bottom: 10px; }
        input {
            width: 100%;
            padding: 12px;
            background: #222;
            border: 1px solid #444;
            color: #fff;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 10px;
            text-align: center;
            letter-spacing: 2px;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: #d4af37;
            color: #030303;
            border: none;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 13px;
        }
        .btn-green { background: #00ff66; }
        .btn-pink { background: #ff0055; color: white; }
        
        .online-arena {
            display: none;
            flex-direction: column;
            gap: 15px;
        }
        .score-box {
            display: flex;
            justify-content: space-between;
            background: #1a1a1a;
            padding: 12px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
        }
        .tap-btn {
            width: 100%;
            padding: 40px 0;
            background: linear-gradient(90deg, #ff0055, #7a00ff, #00ffcc);
            border: none;
            color: white;
            font-size: 20px;
            font-weight: bold;
            border-radius: 16px;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(122, 0, 255, 0.4);
        }
        .tap-btn:active { transform: scale(0.96); }
        .status-text { font-size: 11px; color: #aaa; text-align: center; margin-top: 8px; }
    </style>
</head>
<body>

    <div class="main-layout">
        
        <!-- PANTALLA DE CONEXIÓN -->
        <div class="card" id="lobbyScreen">
            <h2>🌐 SALA DE 6 DÍGITOS</h2>
            <p style="font-size: 10px; color: #ccc; margin-bottom: 12px;">Crea tu sala o escribe el código de 6 dígitos que te dio tu amigo.</p>
            
            <button class="btn btn-green" id="crearSalaBtn">Generar mi Código</button>
            <p class="status-text" id="myIdText" style="font-size: 14px; color: #00ff66; font-weight: bold; margin: 10px 0;">Código: ------</p>
            
            <hr style="border: 0.5px solid #333; margin: 12px 0;">
            
            <input type="text" id="codigoRivalInput" placeholder="Ej: 482910" maxlength="6">
            <button class="btn btn-pink" id="unirseSalaBtn">Conectarme a la Sala</button>
            <p class="status-text" id="connectionStatus"></p>
        </div>

        <!-- PANTALLA DE BATALLA EN LÍNEA -->
        <div class="online-arena" id="gameScreenOnline">
            <div class="card">
                <h2>⚔️ DUELO EN LÍNEA ⚔️</h2>
                <div class="score-box">
                    <span>Tú: <b id="myScore" style="color:#00ff66;">0</b></span>
                    <span>Rival: <b id="rivalScore" style="color:#ff0055;">0</b></span>
                </div>
            </div>

            <button class="tap-btn" id="btnFarmearOnline">🔥 ¡TOCA RÁPIDO! 🔥</button>
            <div class="status-text" style="color:#00ff66;">¡Conectados con éxito!</div>
        </div>

    </div>

    <script>
        let peer;
        let conn;
        let myScore = 0;
        let rivalScore = 0;
        let codigoPersonal = "";

        const lobbyScreen = document.getElementById("lobbyScreen");
        const gameScreenOnline = document.getElementById("gameScreenOnline");
        const myIdText = document.getElementById("myIdText");
        const codigoRivalInput = document.getElementById("codigoRivalInput");
        const crearSalaBtn = document.getElementById("crearSalaBtn");
        const unirseSalaBtn = document.getElementById("unirseSalaBtn");
        const btnFarmearOnline = document.getElementById("btnFarmearOnline");
        const myScoreEl = document.getElementById("myScore");
        const rivalScoreEl = document.getElementById("rivalScore");
        const connectionStatus = document.getElementById("connectionStatus");

        // Generar un número aleatorio de 6 dígitos único para la sala
        function generarCodigo6Digitos() {
            return Math.floor(100000 + Math.random() * 900000).toString();
        }

        crearSalaBtn.addEventListener("click", () => {
            codigoPersonal = generarCodigo6Digitos();
            myIdText.textContent = "Código: " + codigoPersonal;
            crearSalaBtn.disabled = true;
            crearSalaBtn.style.opacity = "0.5";

            // Creamos el peer usando nuestro código corto como ID personalizado
            peer = new Peer("sigma-" + codigoPersonal);

            peer.on('open', () => {
                connectionStatus.textContent = "Sala creada. Esperando al rival...";
            });

            peer.on('error', (err) => {
                // Si casualmente el número ya está en uso, generamos otro al instante
                if(err.type === 'unavailable-id') {
                    codigoPersonal = generarCodigo6Digitos();
                    myIdText.textContent = "Código: " + codigoPersonal;
                    peer.destroy();
                    peer = new Peer("sigma-" + codigoPersonal);
                } else {
                    connectionStatus.textContent = "Error al crear sala. Intenta de nuevo.";
                }
            });

            peer.on('connection', (connection) => {
                conn = connection;
                setupConnection();
                lobbyScreen.style.display = "none";
                gameScreenOnline.style.display = "flex";
            });
        });

        // Unirse a la sala de tu amigo usando su código de 6 dígitos
        unirseSalaBtn.addEventListener("click", () => {
            let codigoAmigo = codigoRivalInput.value.trim();
            if (codigoAmigo.length !== 6) {
                alert("El código debe tener exactamente 6 dígitos.");
                return;
            }

            if (!peer) {
                peer = new Peer(); // Peer temporal para el invitado
            }

            connectionStatus.textContent = "Conectando...";
            
            peer.on('open', () => {
                conn = peer.connect("sigma-" + codigoAmigo);
                setupConnection();
            });
        });

        function setupConnection() {
            conn.on('open', () => {
                lobbyScreen.style.display = "none";
                gameScreenOnline.style.display = "flex";
            });

            conn.on('data', (data) => {
                rivalScore = data;
                rivalScoreEl.textContent = rivalScore;
                verificarFinJuego();
            });

            conn.on('error', () => {
                connectionStatus.textContent = "No se pudo conectar. Revisa el código.";
            });
        }

        btnFarmearOnline.addEventListener("click", () => {
            myScore += 1;
            myScoreEl.textContent = myScore;
            
            if (conn && conn.open) {
                conn.send(myScore);
            }
            verificarFinJuego();
        });

        function verificarFinJuego() {
            if (myScore >= 50) {
                alert("¡Ganaste la batalla!");
                reiniciarJuego();
            } else if (rivalScore >= 50) {
                alert("¡Tu rival te ganó!");
                reiniciarJuego();
            }
        }

        function reiniciarJuego() {
            myScore = 0;
            rivalScore = 0;
            myScoreEl.textContent = 0;
            rivalScoreEl.textContent = 0;
        }
    </script>

</body>
</html>
