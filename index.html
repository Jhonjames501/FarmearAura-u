<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Peruvian Motero Hero - Desert Platformer</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #1a0f00; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #gameContainer { position: relative; width: 100%; height: 100%; display: flex; flex-direction: column; background: #1a0f00; }
        canvas { display: block; width: 100%; flex: 1; background: linear-gradient(to bottom, #d97706, #78350f); }
        
        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(26,15,0,0.95); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; color: #fff; padding: 20px; text-align: center; }
        .oculto { display: none !important; }
        
        h1 { color: #facc15; margin-bottom: 12px; font-size: 24px; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 10px rgba(250,204,21,0.6); }
        .btn { background: linear-gradient(135deg, #f59e0b, #b45309); border: 2px solid #fde68a; padding: 12px 28px; margin: 8px; color: #fff; font-weight: bold; border-radius: 12px; font-size: 16px; cursor: pointer; min-width: 220px; box-shadow: 0 6px 15px rgba(0,0,0,0.5); text-transform: uppercase; }
        .btn:active { transform: scale(0.95); }

        #uiSuperior { position: absolute; top: 10px; left: 10px; right: 10px; display: flex; justify-content: space-between; align-items: center; z-index: 5; pointer-events: none; color: #fff; font-size: 12px; font-weight: bold; text-shadow: 1px 1px 2px #000; background: rgba(0,0,0,0.75); padding: 8px 12px; border-radius: 10px; border: 1px solid rgba(250,204,21,0.3); }
        .hp-bar-container { width: 70px; height: 10px; background: #333; border-radius: 5px; overflow: hidden; border: 1px solid #fff; display: inline-block; vertical-align: middle; }
        #hpFill { width: 100%; height: 100%; background: #22c55e; transition: width 0.2s; }

        #controlesInferiores { position: absolute; bottom: 20px; left: 10px; right: 10px; display: flex; justify-content: space-between; align-items: center; z-index: 5; height: 60px; pointer-events: auto; }
        .joy-base { width: 100px; height: 48px; border-radius: 24px; background: linear-gradient(135deg, #f59e0b, #b45309); border: 2px solid #fff; display: flex; align-items: center; justify-content: center; box-shadow: c0 4px 12px rgba(0,0,0,0.5); cursor: pointer; color: #fff; font-weight: bold; font-size: 13px; }
        .btn-accion { width: 45px; height: 45px; border-radius: 50%; background: rgba(30,30,50,0.9); border: 2px solid rgba(255,255,255,0.8); color: #fff; font-size: 16px; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.4); }
    </style>
</head>
<body>

    <div id="gameContainer">
        <canvas id="gameCanvas"></canvas>

        <div id="uiSuperior" class="oculto">
            <div>HP:<div class="hp-bar-container"><div id="hpFill"></div></div> <span id="hpText">100</span></div>
            <div>TUNAS 🌵: <span id="txtTunas">0</span></div>
            <div>MONEDAS 🪙: <span id="txtOro">0</span></div>
        </div>

        <div id="controlesInferiores" class="oculto">
            <div id="joystickBase" class="joy-base">⚡ SALTAR</div>
            <div style="display: flex; gap: 8px;">
                <div class="btn-accion" id="btnDisparar" title="Disparar">🔥</div>
                <div class="btn-accion" id="btnDash" title="Acelerar Motero">🏍️</div>
            </div>
        </div>

        <div id="screenLobby" class="screen">
            <h1>Peruvian Motero Hero</h1>
            <p style="font-size: 14px; margin-bottom: 20px; color: #fde68a;">¡Aventura en el desierto con chullo y moto!</p>
            <button class="btn" id="btnJugar">Iniciar Aventura</button>
        </div>

        <div id="screenGameOver" class="screen oculto">
            <h1 style="color: #ef4444;">¡Te quedaste sin ruta!</h1>
            <p style="margin-bottom: 15px; font-size: 15px;">Monedas conseguidas: <span id="goOro" style="color: #facc15; font-weight: bold;">0</span></p>
            <button class="btn" id="btnReintentar">Reintentar</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function ajustarCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight - 40;
        }
        window.addEventListener('resize', ajustarCanvas);
        ajustarCanvas();

        let vida = 100, oro = 0, tunas = 0, gameActive = false;
        let mundoX = 0, jugadorX = 70, jugadorY = 0, velocidadY = 0, saltando = false;
        let obstacles = [], coins = [], tunasItems = [], enemies = [], bullets = [];

        document.getElementById('btnJugar').addEventListener('click', () => {
            document.getElementById('screenLobby').classList.add('oculto');
            configurarPartida();
        });

        document.getElementById('btnReintentar').addEventListener('click', () => {
            document.getElementById('screenGameOver').classList.add('oculto');
            configurarPartida();
        });

        function configurarPartida() {
            vida = 100; oro = 0; tunas = 0; mundoX = 0; jugadorY = 0;
            document.getElementById('hpFill').style.width = '100%';
            document.getElementById('hpText').textContent = '100';
            document.getElementById('txtOro').textContent = '0';
            document.getElementById('txtTunas').textContent = '0';

            obstacles = []; coins = []; tunasItems = []; enemies = []; bullets = [];

            // Poblar elementos del desierto peruano basados en el asset sheet
            for (let i = 1; i <= 25; i++) {
                let px = i * 220;
                obstacles.push({ x: px, y: 0, w: 32, h: 22, tipo: 'bloque' });
                coins.push({ x: px + 30, y: 35, recolectada: false });
                if (i % 2 === 0) tunasItems.push({ x: px + 100, y: 40, recolectada: false });
                
                // Enemigos: Pequeño Cactus Monstruo o Momia con Chullo
                let tipoEnemigo = i % 3 === 0 ? 'momia' : 'cactus';
                enemies.push({ x: px + 140, y: 0, hp: 30, maxHp: 30, tipo: tipoEnemigo });
            }

            document.getElementById('uiSuperior').classList.remove('oculto');
            document.getElementById('controlesInferiores').classList.remove('oculto');
            gameActive = true;
        }

        document.getElementById('joystickBase').addEventListener('click', () => {
            if (!gameActive) return;
            if (!saltando) { saltando = true; velocidadY = 13; }
        });

        document.getElementById('btnDisparar').addEventListener('pointerdown', (e) => {
            e.preventDefault(); if (!gameActive) return;
            bullets.push({ x: mundoX + jugadorX + 25, y: jugadorY + 20 });
        });

        document.getElementById('btnDash').addEventListener('pointerdown', (e) => {
            e.preventDefault(); if (!gameActive) return;
            mundoX += 120; // Acelerón de moto
        });

        function loop() {
            if (gameActive) {
                mundoX += 4.5;
                if (saltando) {
                    jugadorY += velocidadY; velocidadY -= 0.95;
                    if (jugadorY <= 0) { jugadorY = 0; saltando = false; }
                }

                let jugadorMundoX = mundoX + jugadorX;

                // Colisiones Monedas
                coins.forEach(c => {
                    if (!c.recolectada && Math.abs(c.x - jugadorMundoX) < 20 && Math.abs(c.y - jugadorY) < 22) {
                        c.recolectada = true; oro += 10;
                        document.getElementById('txtOro').textContent = oro;
                    }
                });

                // Colisiones Tunas (Health Pickup)
                tunasItems.forEach(t => {
                    if (!t.recolectada && Math.abs(t.x - jugadorMundoX) < 20 && Math.abs(t.y - jugadorY) < 22) {
                        t.recolectada = true; tunas++; vida = Math.min(100, vida + 25);
                        document.getElementById('txtTunas').textContent = tunas;
                        document.getElementById('hpFill').style.width = vida + '%';
                        document.getElementById('hpText').textContent = Math.ceil(vida);
                    }
                });

                // Renderizado Gráfico Estilo Desierto Andino
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // Fondo de ruinas de pirámide
                ctx.fillStyle = '#b45309';
                ctx.beginPath();
                ctx.moveTo(100 - (mundoX * 0.2) % 600, canvas.height - 10);
                ctx.lineTo(250 - (mundoX * 0.2) % 600, canvas.height - 120);
                ctx.lineTo(400 - (mundoX * 0.2) % 600, canvas.height - 10);
                ctx.fill();

                // Suelo de bloques de piedra
                ctx.fillStyle = '#451a03'; ctx.fillRect(0, canvas.height - 12, canvas.width, 12);
                ctx.fillStyle = '#d97706'; ctx.fillRect(0, canvas.height - 12, canvas.width, 3);

                // Dibujar Obstáculos (Rocas y Bloques)
                obstacles.forEach(b => {
                    let sx = b.x - mundoX;
                    if (sx > -50 && sx < canvas.width + 50) {
                        ctx.fillStyle = '#78350f'; ctx.fillRect(sx, canvas.height - 34, b.w, b.h);
                        ctx.strokeStyle = '#fde68a'; ctx.strokeRect(sx, canvas.height - 34, b.w, b.h);
                    }
                });

                // Dibujar Monedas con Corona
                coins.forEach(c => {
                    if (!c.recolectada) {
                        let sx = c.x - mundoX;
                        if (sx > -25 && sx < canvas.width + 25) {
                            ctx.beginPath(); ctx.arc(sx, canvas.height - 18 - c.y, 7, 0, Math.PI * 2);
                            ctx.fillStyle = '#facc15'; ctx.fill(); ctx.stroke();
                        }
                    }
                });

                // Dibujar Tunas (Health Pickups)
                tunasItems.forEach(t => {
                    if (!t.recolectada) {
                        let sx = t.x - mundoX;
                        if (sx > -25 && sx < canvas.width + 25) {
                            ctx.fillStyle = '#f43f5e'; ctx.fillRect(sx - 5, canvas.height - 20 - t.y, 10, 10);
                            ctx.fillStyle = '#22c55e'; ctx.fillRect(sx - 2, canvas.height - 24 - t.y, 4, 4); // Corona de la tuna
                        }
                    }
                });

                // Dibujar Enemigos (Cactus y Momias)
                enemies.forEach(en => {
                    if (en.hp > 0) {
                        let sx = en.x - mundoX;
                        if (sx > -40 && sx < canvas.width + 40) {
                            ctx.fillStyle = en.tipo === 'cactus' ? '#15803d' : '#e2e8f0';
                            ctx.fillRect(sx, canvas.height - 36, 20, 24);
                        }
                    }
                });

                // Dibujar Héroe Motero (con su chullo)
                ctx.fillStyle = '#f97316'; ctx.fillRect(jugadorX, canvas.height - 38 - jugadorY, 22, 26);
                ctx.fillStyle = '#eab308'; ctx.fillRect(jugadorX + 4, canvas.height - 44 - jugadorY, 14, 8); // Chullo peruano

                // Disparos
                ctx.fillStyle = '#facc15';
                bullets.forEach((b, idx) => {
                    b.x += 15; let sx = b.x - mundoX;
                    ctx.fillRect(sx, canvas.height - 26 - jugadorY, 10, 3);
                    if (b.x > mundoX + canvas.width) bullets.splice(idx, 1);
                });
            }
            requestAnimationFrame(loop);
        }
        requestAnimationFrame(loop);
    </script>
</body>
</html>
