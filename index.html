<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Desert Motero Quest</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@700&display=swap');
*{margin:0;padding:0;box-sizing:border-box;font-family:'Fredoka',sans-serif;user-select:none;-webkit-user-select:none}
body,html{width:100%;height:100%;overflow:hidden;background:#4FC3F7}
#game{width:100%;height:100%;position:relative}
canvas{position:absolute;top:0;left:0;width:100%;height:100%}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:10}
.hidden{display:none!important}
/* MENU VIBRANTE COMO TU EJEMPLO */
#menu{background:linear-gradient(to bottom, #29B6F6 0%, #81D4FA 35%, #FFE082 100%)}
.topbar{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;z-index:5}
.coinbar{background:#263238;color:#fff;padding:6px 16px;border-radius:20px;display:flex;gap:8px;align-items:center;font-size:20px;box-shadow:0 4px 0 #000;border:2px solid #fff}
.coin-icon{width:32px;height:32px;background:radial-gradient(circle at 30% 30%, #FFEB3B, #F9A825);border-radius:50%;display:grid;place-items:center;border:2px solid #FFC107}
.title{color:#E65100;font-size:42px;text-shadow:3px 3px 0 #fff, 0 0 10px rgba(255,255,255,0.8);letter-spacing:1px;text-align:center;margin-top:60px}
.btnPlay{width:320px;height:100px;background:linear-gradient(#FFEB3B,#FFC107);border:6px solid #BF360C;border-radius:30px;font-size:50px;color:#BF360C;box-shadow:0 8px 0 #BF360C, 0 0 20px rgba(255,235,59,0.8);cursor:pointer;margin-top:20px;text-shadow:2px 2px 0 #fff}
.btnPlay:active{transform:translateY(5px);box-shadow:0 3px 0 #BF360C}
.bonus{position:absolute;left:15px;top:140px;background:linear-gradient(#FFEB3B,#FF9800);padding:8px 12px;border-radius:15px;border:3px solid #fff;transform:rotate(-4deg);text-align:center;box-shadow:0 4px 10px rgba(0,0,0,0.3)}
.removeAd{position:absolute;right:15px;top:160px;background:linear-gradient(#EF5350,#C62828);color:#FFEB3B;padding:10px 14px;border-radius:14px;border:3px solid #FFEB3B;font-weight:bold;transform:rotate(3deg);text-align:center}
#hud{position:absolute;top:0;left:0;right:0;padding:10px 12px;display:flex;justify-content:space-between;z-index:5;color:#fff;text-shadow:2px 2px 0 #000;font-size:18px;pointer-events:none;background:linear-gradient(to bottom, rgba(0,0,0,0.5), transparent)}
.controls{position:absolute;bottom:15px;left:10px;right:10px;display:flex;justify-content:space-between;z-index:5}
.joy{width:78px;height:78px;background:rgba(255,255,255,0.7);border:3px solid #fff;border-radius:50%;display:grid;place-items:center;font-size:28px;box-shadow:0 4px 8px rgba(0,0,0,0.3)}
.joy:active{background:rgba(255,193,7,0.9);transform:scale(0.95)}
</style>
</head>
<body>
<div id="game">
<canvas id="cv"></canvas>

<!-- MENU PRINCIPAL LLAMATIVO -->
<div id="menu" class="screen">
  <div class="topbar">
    <div class="coinbar"><div class="coin-icon">💰</div><span id="mCoins">500</span></div>
    <div style="display:flex;gap:8px"><div class="coinbar">⭐</div><div class="coinbar">⚙️</div><div class="coinbar">🛒</div></div>
  </div>
  <div class="bonus"><div style="font-size:28px">🪙</div><div style="color:#B71C1C;font-weight:bold">Bonus</div><div style="background:#000;color:#fff;font-size:12px;padding:2px 6px;border-radius:6px">07:11:55</div></div>
  <div class="removeAd">REMOVE<br><span style="font-size:22px">Ads</span></div>
  <h1 class="title">DESERT<br>MOTERO QUEST</h1>
  <button class="btnPlay" id="btnPlay">PLAY ▶</button>
  <div style="margin-top:10px;background:rgba(0,0,0,0.2);padding:6px 14px;border-radius:10px;color:#fff">TAP TO RIDE! 🏍️</div>
</div>

<div id="hud" class="hidden"><div>💰 <span id="coins">0</span> | Score <span id="score">0</span></div><div>HP 100</div></div>
<div class="controls hidden" id="controls">
  <div style="display:flex;gap:8px"><div class="joy" id="bLeft">◀</div><div class="joy" id="bRight">▶</div></div>
  <div style="display:flex;gap:8px"><div class="joy" id="bJump">⬆️</div><div class="joy" id="bFire">🔥</div></div>
</div>
</div>

<script>
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
function resize(){cv.width=innerWidth; cv.height=innerHeight} addEventListener('resize',resize); resize();

let world=0, py=0, vy=0, jumping=false, frame=0, active=false, coins=0, score=0;
let platforms=[], coinsArr=[], cactus=[], stars=[];

// Estrellas fondo
for(let i=0;i<30;i++) stars.push({x:Math.random()*2000,y:Math.random()*200, s:Math.random()*2+1});

function init(){
 platforms=[]; coinsArr=[]; cactus=[];
 for(let i=0;i<30;i++){
  let px=i*280+Math.random()*60;
  platforms.push({x:px,y:80+Math.random()*40,w:150+Math.random()*80});
  coinsArr.push({x:px+60,y:140+Math.random()*20,taken:false});
  if(i%2==0) cactus.push({x:px+120,y:0,alive:true});
 }
 world=0; py=0; vy=0; coins=0; score=0;
 document.getElementById('coins').textContent='0';
 document.getElementById('score').textContent='0';
}

// DIBUJO DE TU MOTERO REAL (sin imagen externa, todo con canvas para que no falle)
function drawMotero(x,y, anim){
 ctx.save();
 ctx.translate(x,y);
 // sombra
 ctx.fillStyle='rgba(0,0,0,0.2)'; ctx.beginPath(); ctx.ellipse(32,64,20,6,0,0,Math.PI*2); ctx.fill();
 // botas
 ctx.fillStyle='#5D4037'; ctx.fillRect(10,52,14,12); ctx.fillRect(34,52,14,12);
 // overol jean
 ctx.fillStyle='#1565C0'; ctx.fillRect(12,28,36,26);
 ctx.fillStyle='#0D47A1'; ctx.fillRect(12,28,36,4);
 // camiseta roja
 ctx.fillStyle='#E53935'; ctx.fillRect(12,18,36,14);
 // guantes rojos
 ctx.fillStyle='#D32F2F'; ctx.beginPath(); ctx.arc(6,32,8,0,Math.PI*2); ctx.fill(); ctx.beginPath(); ctx.arc(54,32,8,0,Math.PI*2); ctx.fill();
 // cabeza
 ctx.fillStyle='#FFCC80'; ctx.beginPath(); ctx.arc(30,14,14,0,Math.PI*2); ctx.fill();
 // bigote peruano
 ctx.fillStyle='#3E2723'; ctx.fillRect(22,18,16,3); 
 // gorra con bandera Perú
 ctx.fillStyle='#795548'; ctx.fillRect(14,0,32,10); ctx.fillRect(10,8,40,4);
 ctx.fillStyle='#fff'; ctx.fillRect(26,2,12,6); ctx.fillStyle='#D32F2F'; ctx.fillRect(26,2,4,6); ctx.fillRect(34,2,4,6);
 // brillo ojos
 ctx.fillStyle='#000'; ctx.beginPath(); ctx.arc(24,13,2,0,Math.PI*2); ctx.arc(36,13,2,0,Math.PI*2); ctx.fill();
 ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(25,12,1,0,Math.PI*2); ctx.fill();
 // animacion piernas
 if(!jumping){
  let leg = Math.sin(frame*0.3)*6;
  ctx.fillStyle='#1565C0'; ctx.fillRect(14,48,10,8+leg); ctx.fillRect(36,48,10,8-leg);
 }
 // fuego si dispara
 if(anim==='fire'){
  ctx.fillStyle='#FFEB3B'; ctx.beginPath(); ctx.arc(60,28,10+Math.random()*6,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#FF6F00'; ctx.beginPath(); ctx.arc(65,28,6,0,Math.PI*2); ctx.fill();
 }
 ctx.restore();
}

function loop(){
 if(!active) return; frame++; world+=4;
 if(jumping){py+=vy; vy-=0.9; if(py<=0){py=0;jumping=false;vy=0}}
 let pw=world+80;
 coinsArr.forEach(c=>{if(!c.taken && Math.abs(c.x-pw)<28 && Math.abs(c.y-py)<35){c.taken=true; coins+=10; score+=10; document.getElementById('coins').textContent=coins; document.getElementById('score').textContent=score;}});

 ctx.clearRect(0,0,cv.width,cv.height);
 // cielo vibrante
 let g=ctx.createLinearGradient(0,0,0,cv.height);
 g.addColorStop(0,'#29B6F6'); g.addColorStop(0.4,'#81D4FA'); g.addColorStop(0.7,'#B2EBF2'); g.addColorStop(1,'#FFE082');
 ctx.fillStyle=g; ctx.fillRect(0,0,cv.width,cv.height);
 // piramides fondo parallax
 ctx.fillStyle='#D8B88A'; ctx.globalAlpha=0.6;
 ctx.beginPath(); ctx.moveTo(-world*0.2+80,cv.height-100); ctx.lineTo(-world*0.2+200,cv.height-240); ctx.lineTo(-world*0.2+320,cv.height-100); ctx.fill();
 ctx.beginPath(); ctx.moveTo(-world*0.2+500,cv.height-100); ctx.lineTo(-world*0.2+700,cv.height-300); ctx.lineTo(-world*0.2+900,cv.height-100); ctx.fill();
 ctx.globalAlpha=1;
 // suelo desierto
 ctx.fillStyle='#F9A825'; ctx.fillRect(0,cv.height-50,cv.width,50);
 ctx.fillStyle='#FFCA28'; ctx.fillRect(0,cv.height-54,cv.width,8);
 // cactus decor
 ctx.font='24px sans-serif'; ctx.fillText('🌵', -world*0.5+300, cv.height-55); ctx.fillText('🌵', -world*0.5+800, cv.height-55);
 // plataformas
 platforms.forEach(p=>{
  let sx=p.x-world; if(sx>-200 && sx<cv.width+200){
   ctx.fillStyle='#8D6E63'; ctx.fillRect(sx,cv.height-p.y-20,p.w,20);
   ctx.fillStyle='#5D4037'; ctx.fillRect(sx,cv.height-p.y-20,p.w,4);
   ctx.fillStyle='#FFD54F'; ctx.fillRect(sx+5,cv.height-p.y-24,p.w-10,6);
   ctx.fillStyle='#5D4037'; ctx.font='12px sans-serif'; ctx.fillText('?',sx+p.w/2-4,cv.height-p.y-12);
  }
 });
 // monedas
 coinsArr.forEach(c=>{if(!c.taken){let sx=c.x-world; ctx.font='28px sans-serif'; ctx.fillText('🪙',sx,cv.height-c.y)}});
 // enemigos cactus
 cactus.forEach(e=>{if(e.alive){let sx=e.x-world; if(sx>-60 && sx<cv.width+60){ctx.font='36px sans-serif'; ctx.fillText('🌵',sx,cv.height-50);}}});

 // TU PERSONAJE
 let anim = frame%10<5 ? 'run1':'run2';
 if(jumping) anim='jump';
 drawMotero(80, cv.height-50-64-py, anim);

 requestAnimationFrame(loop);
}

document.getElementById('btnPlay').addEventListener('click',()=>{
 document.getElementById('menu').classList.add('hidden');
 document.getElementById('hud').classList.remove('hidden');
 document.getElementById('controls').classList.remove('hidden');
 init(); active=true; loop();
});
function doJump(){if(!jumping){jumping=true; vy=14}}
document.getElementById('bJump').addEventListener('touchstart',e=>{e.preventDefault(); doJump()});
document.getElementById('bJump').addEventListener('click',doJump);
document.getElementById('bFire').addEventListener('touchstart',e=>{e.preventDefault(); score+=5; document.getElementById('score').textContent=score;});
cv.addEventListener('touchstart',e=>{if(active && e.target===cv) doJump()});
addEventListener('keydown',e=>{if(e.code==='Space') doJump()});
</script>
</body>
</html>
