<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batalla de Aura: Free Fire Plaza Edition</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #080810;
            color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            background-image: radial-gradient(circle at center, #16162c 0%, #080810 100%);
            padding-bottom: 30px;
        }
        .main-layout {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 440px;
            padding: 12px;
        }
        .card {
            background: #12121c;
            border: 2px solid #ffaa00;
            border-radius: 12px;
            padding: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.6);
        }
        h2 { color: #ffaa00; font-size: 12px; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; }
        input {
            width: 100%;
            padding: 8px;
            background: #1c1c2b;
            border: 1px solid #444;
            color: #fff;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 6px;
            text-align: center;
            letter-spacing: 2px;
        }
        .btn {
            width: 100%;
            padding: 8px;
            background: #ffaa00;
            color: #030303;
            border: none;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 10px;
        }
        .btn-green { background: #00ff66; }
        .btn-pink { background: #ff0055; color: white; }

        .menu-modes {
            display: flex;
            gap: 5px;
            margin-bottom: 4px;
        }
        .mode-btn {
            flex: 1;
            background: #171727;
            border: 1px solid #ffaa00;
            color: #ffaa00;
            padding: 6px;
            font-size: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .mode-btn.active { background: #ffaa00; color: #080810; }

        /* Plaza de Entrenamiento Estilo Free Fire (Más grande y real) */
        .battle-arena {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: linear-gradient(135deg, #1b263b, #0d1b2a);
            border: 2px solid #00ffff;
            border-radius: 12px;
            padding: 20px 15px;
            margin-bottom: 8px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 25px rgba(0, 255, 255, 0.25), 0 0 15px rgba(0,255,255,0.1);
        }
        /* Efecto suelo de plaza */
        .battle-arena::after {
            content: "";
            position: absolute;
            bottom: 0; left: 0; right: 0;
            height: 8px;
            background: linear-gradient(90deg, #00ffff, #ff00ff, #ffaa00);
            opacity: 0.8;
        }

        .fighter {
            text-align: center;
            width: 42%;
            position: relative;
            transition: transform 0.1s ease;
        }
        
        /* Personajes Reales en Miniatura (Sprites / Iconos de personajes de FF) */
        .fighter-model {
            width: 75px;
            height: 95px;
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            margin: 0 auto 6px auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            backdrop-filter: blur(2px);
        }
        .fighter-avatar {
            font-size: 45px;
            filter: drop-shadow(0 0 8px rgba(255,255,255,0.5));
            transition: transform 0.2s;
        }
        .fighter-skin-name {
            font-size: 7px;
            color: #00ffff;
            background: rgba(0,0,0,0.7);
            padding: 1px 4px;
            border-radius: 4px;
            margin-top: 2px;
            text-transform: uppercase;
        }

        .fighter-name { font-size: 10px; font-weight: bold; margin-bottom: 2px; }
        .fighter-score { font-size: 24px; font-weight: bold; text-shadow: 0 0 10px currentColor; }
        
        .vs-badge {
            font-size: 15px;
            font-weight: bold;
            color: #ffaa00;
            text-shadow: 0 0 12px #ff0055;
            animation: pulseVs 1.5s infinite alternate;
        }
        @keyframes pulseVs {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.1); opacity: 1; }
        }

        /* Selector de personajes / Skins */
        .selector-box {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 8px;
            background: #171727;
            padding: 6px;
            border-radius: 8px;
            border: 1px solid #333;
        }
        .char-option {
            font-size: 22px;
            background: #1f1f33;
            border: 1px solid #444;
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .char-option.activo { border-color: #00ff66; background: #113322; box-shadow: 0 0 10px #00ff66; transform: scale(1.05); }

        /* Animaciones de Emotes fluidas estilo plaza */
        @keyframes emotePlaza {
            0% { transform: translateY(0) rotate(0deg) scale(1); }
            20% { transform: translateY(-12px) rotate(-10deg) scale(1.15); filter: drop-shadow(0 0 15px #00ff66); }
            40% { transform: translateY(0) rotate(5deg) scale(1); }
            60% { transform: translateY(-12px) rotate(10deg) scale(1.15); filter: drop-shadow(0 0 15px #ffaa00); }
            80% { transform: translateY(0) rotate(-5deg) scale(1); }
            100% { transform: translateY(0) rotate(0deg) scale(1); }
        }
        .animar-baile { animation: emotePlaza 0.45s ease-in-out; }

        @keyframes emoteRivalAnim {
            0% { transform: translateX(0) scale(1); }
            50% { transform: translateX(-15px) scale(1.15) rotate(-6deg); filter: drop-shadow(0 0 15px #ff0055); }
            100% { transform: translateX(0) scale(1); }
        }
        .animar-rival { animation: emoteRivalAnim 0.35s ease-in-out; }

        .energy-container {
            background: #171727;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 6px;
            margin-bottom: 6px;
            text-align: left;
        }
        .energy-label { font-size: 9px; color: #aaa; margin-bottom: 3px; display: flex; justify-content: space-between; }
        .energy-bar-bg { width: 100%; background: #222; height: 6px; border-radius: 3px; overflow: hidden; }
        .energy-bar-fill { width: 100%; background: linear-gradient(90deg, #ffaa00, #00ff66); height: 100%; }

        .action-btn {
            width: 100%;
            padding: 14px;
            border: none;
            font-weight: bold;
            border-radius: 10px;
            font-size: 13px;
            cursor: pointer;
            text-transform: uppercase;
            background: linear-gradient(90deg, #ff0055, #ffaa00, #00ffcc);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 170, 0, 0.4);
            margin-bottom: 6px;
        }
        .action-btn:active { transform: scale(0.95); }
        .action-btn:disabled { background: #444; color: #888; box-shadow: none; cursor: not-allowed; }

        .special-btn {
            width: 100%;
            padding: 9px;
            background: linear-gradient(90deg, #ffaa00, #ff4400);
            color: #080810;
            border: none;
            font-weight: bold;
            border-radius: 6px;
            font-size: 10px;
            cursor: pointer;
            text-transform: uppercase;
            margin-bottom: 6px;
        }
        .special-btn:disabled { background: #333; color: #666; cursor: not-allowed; }

        /* Tienda de Pases / Objetos */
        .store-box {
            display: flex;
            justify-content: space-between;
            gap: 4px;
            background: #171727;
            border: 1px dashed #555;
            padding: 6px;
            border-radius: 8px;
            font-size: 8px;
            margin-bottom: 6px;
        }
        .store-item { 
            background: #1f1f33; 
            padding: 6px 4px; 
            border-radius: 5px; 
            flex: 1; 
            text-align: center; 
            border: 1px solid #333; 
            cursor: pointer;
            color: #ccc;
        }
        .store-item:hover { border-color: #ffaa00; color: #fff; }

        /* Chat y Burlas */
        .chat-container {
            background: #12121c;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 6px;
            margin-top: 6px;
        }
        .chat-burlas { display: flex; gap: 4px; margin-top: 4px; }
        .chat-btn {
            background: #1c1c2b;
            border: 1px solid #444;
            color: #ddd;
            font-size: 9px;
            padding: 4px;
            border-radius: 4px;
            flex: 1;
            cursor: pointer;
        }
        .chat-btn:hover { background: #333; border-color: #ff0055; }
        #chatLog { font-size: 9px; color: #00ffcc; margin-top: 3px; font-style: italic; }
    </style>
</head>
<body>

    <div class="main-layout">
        
        <!-- SELECCIÓN DE MODO -->
        <div class="menu-modes">
            <button class="mode-btn active" id="btnModoCPU" onclick="cambiarModo('cpu')">MODO VS BOT</button>
            <button class="mode-btn" id="btnModoOnline" onclick="cambiarModo('online')">MULTIJUGADOR 1V1</button>
        </div>

        <!-- PANEL ONLINE -->
        <div class="card" id="panelOnline" style="display: none;">
            <h2>🌐 Sala Privada Plaza 1v1</h2>
            <button class="btn btn-green" id="crearSalaBtn" style="margin-bottom:4px;">Generar Código Sala</button>
            <p id="myIdText" style="font-size: 11px; color: #00ff66; font-weight: bold; margin: 4px 0;">Código: ------</p>
            <input type="text" id="codigoRivalInput" placeholder="Código de la sala" maxlength="6">
            <button class="btn btn-pink" id="unirseSalaBtn">Entrar a Sala</button>
            <p id="connectionStatus" style="font-size: 9px; color: #aaa; margin-top: 2px;">Estado: Desconectado</p>
        </div>

        <!-- SELECCIÓN DE SKIN / PERSONAJE REAL -->
        <div class="card">
            <h2>Elige tu Skin de Personaje</h2>
            <div class="selector-box">
                <div class="char-option activo" onclick="cambiarGuerrero('🥷', 'Alok', this)">🥷</div>
                <div class="char-option" onclick="cambiarGuerrero('🕵️‍♂️', 'Chrono', this)">🕵️‍♂️</div>
                <div class="char-option" onclick="cambiarGuerrero('🦹‍♂️', 'Criminal', this)">🦹‍♂️</div>
                <div class="char-option" onclick="cambiarGuerrero('🤖', 'Kenta', this)">🤖</div>
            </div>
        </div>

        <!-- ARENA DE BATALLA REAL (PLAZA GRANDE) -->
        <div class="card" style="border-color: #00ffff;">
            
            <div class="battle-arena">
                <!-- JUGADOR 1 -->
                <div class="fighter" id="fighterP1">
                    <div class="fighter-model">
                        <div class="fighter-avatar" id="avatarP1">🥷</div>
                        <div class="fighter-skin-name" id="skinNameP1">Alok</div>
                    </div>
                    <div class="fighter-name" style="color: #00ff66;">TÚ (<span id="multiplicadorText">x1</span>)</div>
                    <div class="fighter-score" id="scoreP1" style="color: #00ff66;">0</div>
                </div>

                <div class="vs-badge">VS</div>

                <!-- JUGADOR 2 / RIVAL -->
                <div class="fighter" id="fighterP2">
                    <div class="fighter-model">
                        <div class="fighter-avatar" id="avatarP2">🤖</div>
                        <div class="fighter-skin-name" id="skinNameP2">Bot FF</div>
                    </div>
                    <div class="fighter-name" id="labelRival" style="color: #ff0055;">BOT RIVAL</div>
                    <div class="fighter-score" id="scoreP2" style="color: #ff0055;">0</div>
                </div>
            </div>

            <!-- ESTAMINA -->
            <div class="energy-container">
                <div class="energy-label">
                    <span>⚡ ENERGÍA DE EMOTE</span>
                    <span id="energyText">100%</span>
                </div>
                <div class="energy-bar-bg">
                    <div class="energy-bar-fill" id="energyFill"></div>
                </div>
            </div>

            <!-- BOTÓN PRINCIPAL DE FARMEO -->
            <button class="action-btn" id="btnFarmear">🔥 Framear Aura (Emote) 🔥</button>

            <!-- PODER ESPECIAL -->
            <button class="special-btn" id="btnPoder" onclick="usarPoderEspecial()">⚡ Baile Épico (+25 Aura)</button>

            <!-- TIENDA DE MEJORA -->
            <div class="store-box">
                <div class="store-item" onclick="comprarMejora(500, 2, 'Criminal')">🎭 Criminal<br><b>500 (x2)</b></div>
                <div class="store-item" onclick="comprarMejora(3000, 5, 'MP40 Max')">⚡ MP40<br><b>3k (x5)</b></div>
                <div class="store-item" onclick="comprarMejora(10000, 15, 'Angelical')">🪽 Botas<br><b>10k (x15)</b></div>
            </div>

            <!-- CHAT RÁPIDO / BURLAS -->
            <div class="chat-container">
                <div style="font-size: 8px; color: #aaa;">💬 BURLAS DE SALA:</div>
                <div class="chat-burlas">
                    <button class="chat-btn" onclick="enviarMensajeChat('¡Ya aguanta JAJJAJJA! 🗿')">🗿 Ya aguanta</button>
                    <button class="chat-btn" onclick="enviarMensajeChat('¡Manco de sala! 🔥')">🔥 Manco</button>
                    <button class="chat-btn" onclick="enviarMensajeChat('¡GG facilito! ⚡')">⚡ GG</button>
                </div>
                <div id="chatLog">En la plaza de entrenamiento...</div>
            </div>
        </div>

    </div>

    <script>
        let modoJuego = 'cpu';
        let score1 = 0, score2 = 0;
        let estamina = 100;
        let multiplicador = 1;
        let estaCansado = false;
        let avatarActual = '🥷';
        let skinNombreActual = 'Alok';
        let poderCargado = true;
        let peer, conn, botInterval;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function reproducirSonido(frecuencia, tipo, duracion) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = tipo;
            osc.frequency.value = frecuencia;
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duracion);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duracion);
        }

        function cambiarModo(modo) {
            modoJuego = modo;
            reiniciarPartida();
            if(modo === 'cpu') {
                document.getElementById('btnModoCPU').classList.add('active');
                document.getElementById('btnModoOnline').classList.remove('active');
                document.getElementById('panelOnline').style.display = 'none';
                document.getElementById('labelRival').textContent = "BOT RIVAL";
                document.getElementById('skinNameP2').textContent = "Bot FF";
                document.getElementById('avatarP2').textContent = "🤖";
                iniciarBot();
            } else {
                document.getElementById('btnModoOnline').classList.add('active');
                document.getElementById('btnModoCPU').classList.remove('active');
                document.getElementById('panelOnline').style.display = 'block';
                document.getElementById('labelRival').textContent = "JUGADOR 2";
                if(botInterval) clearInterval(botInterval);
            }
        }

        function cambiarGuerrero(emoji, nombreSkin, el) {
            document.querySelectorAll('.char-option').forEach(e => e.classList.remove('activo'));
            el.classList.add('activo');
            avatarActual = emoji;
            skinNombreActual = nombreSkin;
            document.getElementById("avatarP1").textContent = emoji;
            document.getElementById("skinNameP1").textContent = nombreSkin;
            reproducirSonido(600, 'sine', 0.1);
            sincronizarDatos();
        }

        function comprarMejora(costo, multValor, nombre) {
            if (score1 >= costo) {
                score1 -= costo;
                multiplicador = multValor;
                document.getElementById("scoreP1").textContent = score1;
                document.getElementById("multiplicadorText").textContent = `x${multiplicador}`;
                reproducirSonido(880, 'triangle', 0.3);
                alert(`¡Equipaste ${nombre}! Tu multiplicador subió a x${multiplicador}`);
                sincronizarDatos();
            } else {
                reproducirSonido(150, 'sawtooth', 0.2);
                alert("¡Te faltan puntos de aura!");
            }
        }

        function usarPoderEspecial() {
            if (!poderCargado) return;
            score1 += 25 * multiplicador;
            document.getElementById("scoreP1").textContent = score1;
            reproducirSonido(900, 'square', 0.4);
            alert("¡Baile Épico activado! +25 aura instantánea.");
            
            poderCargado = false;
            let btnPoder = document.getElementById("btnPoder");
            btnPoder.disabled = true;
            let tiempo = 10;
            let intervalo = setInterval(() => {
                btnPoder.textContent = `⏳ En Cooldown (${tiempo}s)...`;
                tiempo--;
                if(tiempo < 0) {
                    clearInterval(intervalo);
                    poderCargado = true;
                    btnPoder.disabled = false;
                    btnPoder.textContent = "⚡ Baile Épico (+25 Aura)";
                }
            }, 1000);
            sincronizarDatos();
            verificarGanador();
        }

        function enviarMensajeChat(texto) {
            document.getElementById("chatLog").textContent = "Tú: " + texto;
            if (conn && conn.open) conn.send({ tipo: 'chat', contenido: texto });
        }

        function iniciarBot() {
            if(botInterval) clearInterval(botInterval);
            botInterval = setInterval(() => {
                if(modoJuego === 'cpu' && score1 < 150 && score2 < 150) {
                    if(Math.random() > 0.4) {
                        score2 += 1;
                        document.getElementById("scoreP2").textContent = score2;
                        let f2 = document.getElementById("fighterP2");
                        f2.classList.add("animar-rival");
                        setTimeout(() => f2.classList.remove("animar-rival"), 350);
                        verificarGanador();
                    }
                }
            }, 700);
        }

        const btnFarmear = document.getElementById("btnFarmear");
        btnFarmear.addEventListener("click", () => {
            if (estaCansado) return;

            score1 += multiplicador;
            document.getElementById("scoreP1").textContent = score1;
            reproducirSonido(350 + (multiplicador * 15), 'square', 0.08);

            let f1 = document.getElementById("fighterP1");
            f1.classList.add("animar-baile");
            setTimeout(() => f1.classList.remove("animar-baile"), 450);

            estamina -= 5;
            if (estamina <= 0) {
                estamina = 0;
                estaCansado = true;
                btnFarmear.disabled = true;
                btnFarmear.textContent = "💤 CANSADO (Recuperando)...";
                setTimeout(() => {
                    estamina = 100;
                    estaCansado = false;
                    btnFarmear.disabled = false;
                    btnFarmear.textContent = "🔥 Framear Aura (Emote) 🔥";
                }, 2000);
            }
            document.getElementById("energyFill").style.width = estamina + "%";
            document.getElementById("energyText").textContent = estamina + "%";

            sincronizarDatos();
            verificarGanador();
        });

        function verificarGanador() {
            if (score1 >= 150) {
                reproducirSonido(800, 'sine', 0.5);
                alert("¡Ganaste la batalla de aura en la plaza!");
                reiniciarPartida();
            } else if (score2 >= 150) {
                reproducirSonido(120, 'sawtooth', 0.6);
                alert("¡El rival te ganó el duelo de emotes!");
                reiniciarPartida();
            }
        }

        function reiniciarPartida() {
            score1 = 0; score2 = 0;
            document.getElementById("scoreP1").textContent = 0;
            document.getElementById("scoreP2").textContent = 0;
            estamina = 100; multiplicador = 1;
            document.getElementById("multiplicadorText").textContent = "x1";
        }

        // Multijugador Online (PeerJS)
        document.getElementById("crearSalaBtn").addEventListener("click", () => {
            let codigo = Math.floor(100000 + Math.random() * 900000).toString();
            document.getElementById("myIdText").textContent = "Código: " + codigo;
            peer = new Peer("ffaura-plaza-" + codigo);
            peer.on('open', () => document.getElementById("connectionStatus").textContent = "Esperando rival en sala...");
            peer.on('connection', (c) => { conn = c; setupConnection(); });
        });

        document.getElementById("unirseSalaBtn").addEventListener("click", () => {
            let codigoAmigo = document.getElementById("codigoRivalInput").value.trim();
            if(codigoAmigo.length !== 6) { alert("Ingresa código de 6 dígitos"); return; }
            if(!peer) peer = new Peer();
            peer.on('open', () => {
                conn = peer.connect("ffaura-plaza-" + codigoAmigo);
                setupConnection();
            });
        });

        function setupConnection() {
            document.getElementById("connectionStatus").textContent = "¡Rival conectado en la plaza!";
            conn.on('open', () => sincronizarDatos());
            conn.on('data', (data) => {
                if(data.tipo === 'chat') {
                    document.getElementById("chatLog").textContent = "Rival: " + data.contenido;
                } else if(data.score !== undefined) {
                    score2 = data.score;
                    document.getElementById("scoreP2").textContent = score2;
                    if(data.avatar) {
                        document.getElementById("avatarP2").textContent = data.avatar;
                    }
                    if(data.skinNombre) {
                        document.getElementById("skinNameP2").textContent = data.skinNombre;
                    }
                    let f2 = document.getElementById("fighterP2");
                    f2.classList.add("animar-rival");
                    setTimeout(() => f2.classList.remove("animar-rival"), 350);
                    verificarGanador();
                }
            });
        }

        function sincronizarDatos() {
            if (conn && conn.open) {
                conn.send({ score: score1, avatar: avatarActual, skinNombre: skinNombreActual });
            }
        }

        iniciarBot();
    </script>
</body>
</html>
