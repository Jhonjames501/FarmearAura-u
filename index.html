<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Free Fire 2D - Multijugador Online por Sala</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            width: 100vw;
            height: 100vh;
            background-color: #05050a;
            color: #f0f0f0;
            overflow: hidden;
            position: fixed;
            user-select: none;
        }

        #efectoDaño {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(255,0,0,0) 40%, rgba(255,0,0,0.6) 100%);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.1s ease;
            z-index: 999;
        }
        .recibiendo-daño { opacity: 1 !important; }

        .app-container {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 100vw;
            height: 100vh;
            padding: 6px 10px; /* Más espacio en los bordes para que no se pegue */
            position: relative;
        }

        #screenLobby, #screenLevels, #screenMultiplayer {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(135deg, #0d0d1a, #030308);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
            text-align: center;
        }
        .oculto { display: none !important; }

        .lobby-card-ui {
            background: rgba(20, 20, 35, 0.95);
            border: 2px solid #ffaa00;
            border-radius: 12px;
            padding: 20px;
            width: 90%;
            max-width: 340px;
            box-shadow: 0 0 20px rgba(255,170,0,0.3);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .lobby-title {
            font-size: 20px;
            color: #ffaa00;
            text-shadow: 0 0 10px rgba(255,170,0,0.6);
            letter-spacing: 2px;
        }
        .lobby-subtitle {
            font-size: 11px;
            color: #00ffff;
            margin-bottom: 4px;
        }

        .main-btn {
            background: linear-gradient(135deg, #ffaa00, #ff4400);
            border: 2px solid #fff;
            color: #fff;
            padding: 12px 15px;
            font-size: 12px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(255,170,0,0.4);
            width: 100%;
            transition: transform 0.1s;
        }
        .main-btn:active { transform: scale(0.95); }

        .room-input {
            background: #141420;
            border: 2px solid #00ffff;
            color: #fff;
            padding: 10px;
            font-size: 16px;
            text-align: center;
            border-radius: 8px;
            width: 100%;
            letter-spacing: 4px;
        }

        .levels-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            max-height: 40vh;
            overflow-y: auto;
            width: 100%;
            padding: 4px;
        }
        .level-card {
            background: #141420;
            border: 2px solid #555;
            border-radius: 6px;
            padding: 10px 0;
            font-size: 11px;
            font-weight: bold;
            color: #00ff66;
            cursor: pointer;
        }

        .top-hud-stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #12121c;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 10px;
            font-weight: bold;
            height: 30px;
        }

        .volume-control-box {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 9px;
            color: #ffaa00;
        }
        .volume-control-box input {
            width: 45px;
            accent-color: #ffaa00;
        }

        .battle-arena {
            flex: 1;
            display: flex;
            background: linear-gradient(135deg, rgba(15, 20, 35, 1), rgba(5, 10, 20, 1));
            border: 2px solid #ffaa00;
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            margin: 6px 0;
        }

        canvas { display: block; width: 100%; height: 100%; }

        /* Controles inferiores rediseñados y más grandes */
        .controls-hud {
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: rgba(15, 15, 25, 0.95);
            border: 2px solid #555;
            padding: 10px 14px;
            border-radius: 10px;
        }

        .hud-row-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .hp-container { width: 150px; }
        .hp-label { font-size: 8px; color: #aaa; margin-bottom: 2px; display: flex; justify-content: space-between; }
        .hp-bar-bg { width: 100%; background: #222; height: 6px; border-radius: 3px; overflow: hidden; }
        .hp-bar-fill { width: 100%; background: linear-gradient(90deg, #ff0055, #00ff66); height: 100%; transition: width 0.15s ease; }

        .actions-mini-grid {
            display: flex;
            gap: 8px;
        }
        .round-action-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.9);
            font-size: 11px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.5);
        }
        .round-action-btn span { font-size: 7px; font-weight: bold; color: #fff; }

        #btnAccion1 { background: linear-gradient(135deg, rgba(255,0,85,0.85), rgba(255,170,0,0.85)); border-color: #ffaa00; }
        #btnAccion2 { background: linear-gradient(135deg, rgba(255,170,0,0.85), rgba(255,68,0,0.85)); border-color: #ffaa00; }
        #btnAccion3 { background: linear-gradient(135deg, rgba(0,255,102,0.85), rgba(0,150,80,0.85)); border-color: #00ff66; }
        #btnAccion4 { background: linear-gradient(135deg, rgba(138,43,226,0.85), rgba(255,0,255,0.85)); border-color: #ff00ff; }

        .hud-row-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 5px;
        }

        .joystick-base {
            width: 75px;
            height: 75px;
            background: rgba(30, 30, 50, 0.7);
            border: 3px solid rgba(255, 170, 0, 0.8);
            border-radius: 50%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
        }
        .joystick-knob {
            width: 35px;
            height: 35px;
            background: linear-gradient(135deg, #ffaa00, #ff4400);
            border: 2px solid #fff;
            border-radius: 50%;
            position: absolute;
            pointer-events: none;
        }

        .jump-action-btn {
            width: 90px;
            height: 45px;
            background: linear-gradient(135deg, #00ffff, #0088cc);
            border: 2px solid #fff;
            border-radius: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(0,255,255,0.4);
        }
        .jump-action-btn span { font-size: 9px; color: #fff; margin-left: 4px; }

        .info-bottom-bar {
            display: flex;
            justify-content: space-between;
            font-size: 8px;
            color: #888;
            padding: 2px 4px;
        }
        #chatLog { color: #00ffcc; font-style: italic; }
    </style>
</head>
<body>

    <div id="screenLobby">
        <div class="lobby-card-ui">
            <h1 class="lobby-title">FREE FIRE 2D</h1>
            <p class="lobby-subtitle">ONLINE MULTIPLAYER</p>
            <div style="font-size: 28px; margin: 5px 0;">🌐🔥</div>
            <button class="main-btn" id="btnJugarCampana">▶ CAMPAÑA SOLO</button>
            <button class="main-btn" id="btnOnlineMenu" style="background: linear-gradient(135deg, #00ffcc, #0088cc);">👥 MODO ONLINE (SALA)</button>
        </div>
    </div>

    <div id="screenLevels" class="oculto">
        <div class="lobby-card-ui" style="max-width: 360px;">
            <h2 class="lobby-title" style="font-size: 17px;">NIVELES SOLO</h2>
            <div class="levels-grid" id="levelsGridContainer"></div>
            <button class="main-btn" style="padding: 8px 10px; font-size: 10px; margin-top: 6px;" id="btnVolverLobby">Volver</button>
        </div>
    </div>

    <div id="screenMultiplayer" class="oculto">
        <div class="lobby-card-ui">
            <h2 class="lobby-title" style="font-size: 17px;">CÓDIGO DE SALA</h2>
            <p class="lobby-subtitle">Crea una sala o ingresa el código de tu amigo</p>
            <button class="main-btn" id="btnCrearSala">⚡ CREAR NUEVA SALA</button>
            <div style="font-size: 10px; color: #aaa; margin: 6px 0;">O UNIRSE A UNA SALA:</div>
            <input type="text" id="inputCodigoSala" class="room-input" placeholder="Ej: 4815" maxlength="6">
            <button class="main-btn" style="background: linear-gradient(135deg, #00ffcc, #0088cc); margin-top: 6px;" id="btnUnirseSala">🔗 UNIRSE A SALA</button>
            <button class="main-btn" style="padding: 8px 10px; font-size: 10px; margin-top: 8px; background: #444;" id="btnVolverMenuOnline">Volver</button>
        </div>
    </div>

    <div id="efectoDaño"></div>

    <div class="app-container">
        <div class="top-hud-stats">
            <span>SALA: <strong id="txtSalaInfo" style="color:#00ffff;">SOLO</strong></span>
            <span style="color:#ffaa00;" id="txtRolInfo">Jugador 1</span>
            <div class="volume-control-box">
                <span>🔊</span>
                <input type="range" id="volRange" min="0" max="1" step="0.1" value="0.8">
            </div>
            <span>💎 <strong id="txtOro" style="color:#00ff66;">0</strong></span>
        </div>

        <div class="battle-arena">
            <canvas id="gameCanvas"></canvas>
        </div>

        <div class="controls-hud">
            <div class="hud-row-top">
                <div class="hp-container">
                    <div class="hp-label">
                        <span>❤️ MI VIDA (HP)</span>
                        <span id="hpText">100 / 100 HP</span>
                    </div>
                    <div class="hp-bar-bg">
                        <div class="hp-bar-fill" id="hpFill" style="width: 100%;"></div>
                    </div>
                </div>
                <div class="actions-mini-grid">
                    <button class="round-action-btn" id="btnAccion1">🔥<span>Fuego</span></button>
                    <button class="round-action-btn" id="btnAccion2">🐺<span>Dash</span></button>
                    <button class="round-action-btn" id="btnAccion3">🤖<span>Escudo</span></button>
                    <button class="round-action-btn" id="btnAccion4">🦅<span>Volar</span></button>
                </div>
            </div>

            <div class="hud-row-bottom">
                <div class="joystick-base" id="joystickBase">
                    <div class="joystick-knob" id="joystickKnob"></div>
                </div>
                <div class="jump-action-btn" id="btnSaltoPrincipal">
                    ⬆️<span id="txtBtnSalto">SALTAR</span>
                </div>
            </div>
        </div>

        <div class="info-bottom-bar">
            <span>ESTADO: <strong id="lblEstadoTransformacion" style="color:#ffaa00;">Normal</strong></span>
            <span id="chatLog">Conectado al servidor global.</span>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            databaseURL: "https://freefire2d-default-rtdb.firebaseio.com/"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function ajustarCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', ajustarCanvas);
        ajustarCanvas();

        let vida = 100;
        let oro = 0;
        let mundoX = 0;
        let jugadorX = 70;
        let jugadorY = 0;
        let velocidadY = 0;
        let saltando = false;
        let gameActive = false;

        let esOnline = false;
        let codigoSalaActual = null;
        let miIdJugador = 'p_' + Math.floor(Math.random() * 100000);
        let datosCompañero = { x: 150, y: 0, vida: 100 };

        let obstacles = [];
        let coins = [];
        let enemies = [];
        let bullets = [];

        let audioCtx = null;
        let masterGain = null;

        function inicializarAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                masterGain = audioCtx.createGain();
                masterGain.gain.value = parseFloat(document.getElementById('volRange').value);
                masterGain.connect(audioCtx.destination);
            }
            if (audioCtx.state === 'suspended') { audioCtx.resume(); }
        }

        document.getElementById('volRange').addEventListener('input', (e) => {
            if (masterGain) masterGain.gain.value = parseFloat(e.target.value);
        });

        function reproducirSonido(freq, tipo, dur) {
            try {
                if (!audioCtx || audioCtx.state !== 'running') return;
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = tipo;
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
                osc.connect(gain);
                gain.connect(masterGain);
                osc.start();
                osc.stop(audioCtx.currentTime + dur);
            } catch (e) {}
        }

        document.getElementById('btnJugarCampana').addEventListener('click', () => {
            inicializarAudio();
            document.getElementById('screenLobby').classList.add('oculto');
            document.getElementById('screenLevels').classList.remove('oculto');
        });

        document.getElementById('btnOnlineMenu').addEventListener('click', () => {
            inicializarAudio();
            document.getElementById('screenLobby').classList.add('oculto');
            document.getElementById('screenMultiplayer').classList.remove('oculto');
        });

        document.getElementById('btnVolverLobby').addEventListener('click', () => {
            document.getElementById('screenLevels').classList.add('oculto');
            document.getElementById('screenLobby').classList.remove('oculto');
        });

        document.getElementById('btnVolverMenuOnline').addEventListener('click', () => {
            document.getElementById('screenMultiplayer').classList.add('oculto');
            document.getElementById('screenLobby').classList.remove('oculto');
        });

        document.getElementById('btnCrearSala').addEventListener('click', () => {
            inicializarAudio();
            codigoSalaActual = Math.floor(1000 + Math.random() * 9000).toString();
            esOnline = true;
            document.getElementById('txtSalaInfo').textContent = codigoSalaActual;
            document.getElementById('txtRolInfo').textContent = "Host (P1)";
            alert(`¡Sala creada con éxito!\nComparte este código con tu compañero: ${codigoSalaActual}`);
            
            document.getElementById('screenMultiplayer').classList.add('oculto');
            iniciarPartidaOnline();
        });

        document.getElementById('btnUnirseSala').addEventListener('click', () => {
            let codigo = document.getElementById('inputCodigoSala').value.trim();
            if (codigo.length < 4) {
                alert("Por favor ingresa un código de sala válido.");
                return;
            }
            inicializarAudio();
            codigoSalaActual = codigo;
            esOnline = true;
            document.getElementById('txtSalaInfo').textContent = codigoSalaActual;
            document.getElementById('txtRolInfo').textContent = "Invitado (P2)";

            document.getElementById('screenMultiplayer').classList.add('oculto');
            iniciarPartidaOnline();
        });

        function construirMenuNiveles() {
            let container = document.getElementById('levelsGridContainer');
            container.innerHTML = '';
            for (let i = 1; i <= 10; i++) {
                let card = document.createElement('div');
                card.className = 'level-card';
                card.textContent = `Nvl ${i}`;
                card.addEventListener('click', () => iniciarNivelSolo(i));
                container.appendChild(card);
            }
        }
        construirMenuNiveles();

        function iniciarNivelSolo(num) {
            esOnline = false;
            document.getElementById('screenLevels').classList.add('oculto');
            configurarPartidaComun();
        }

        function iniciarPartidaOnline() {
            configurarPartidaComun();
            let refSala = db.ref('salas/' + codigoSalaActual + '/' + miIdJugador);
            
            setInterval(() => {
                if (!gameActive || !esOnline) return;
                refSala.set({
                    x: mundoX + jugadorX,
                    y: jugadorY,
                    vida: vida
                });
            }, 50);

            db.ref('salas/' + codigoSalaActual).on('value', (snapshot) => {
                let jugadores = snapshot.val();
                if (!jugadores) return;
                Object.keys(jugadores).forEach(id => {
                    if (id !== miIdJugador) {
                        datosCompañero = jugadores[id];
                    }
                });
            });
        }

        function configurarPartidaComun() {
            vida = 100;
            document.getElementById('hpFill').style.width = '100%';
            document.getElementById('hpText').textContent = '100 / 100 HP';
            mundoX = 0;
            jugadorY = 0;
            obstacles = [];
            coins = [];
            enemies = [];
            bullets = [];

            for (let i = 1; i < 20; i++) {
                let posX = i * 220 + Math.random() * 30;
                obstacles.push({ x: posX, y: (i % 2 === 0) ? 0 : 32, w: 35, h: 22, icono: '📦' });
                coins.push({ x: posX + 20, y: 32, recolectada: false });
                enemies.push({ x: posX + 130, y: 0, hp: 40, emoji: '🧟', vel: 0.5 });
            }
            gameActive = true;
        }

        const joyBase = document.getElementById('joystickBase');
        const joyKnob = document.getElementById('joystickKnob');
        let joyActive = false;
        let direccionMovimiento = 0;

        function actualizarJoystick(clientX) {
            let rect = joyBase.getBoundingClientRect();
            let centroX = rect.left + rect.width / 2;
            let deltaX = clientX - centroX;
            let radioMax = 22;
            if (deltaX > radioMax) deltaX = radioMax;
            if (deltaX < -radioMax) deltaX = -radioMax;
            joyKnob.style.transform = `translate(${deltaX}px, 0px)`;
            direccionMovimiento = deltaX / radioMax;
        }

        joyBase.addEventListener('pointerdown', (e) => { joyActive = true; actualizarJoystick(e.clientX); });
        window.addEventListener('pointermove', (e) => { if (joyActive) actualizarJoystick(e.clientX); });
        window.addEventListener('pointerup', () => { joyActive = false; direccionMovimiento = 0; joyKnob.style.transform = `translate(0px, 0px)`; });

        document.getElementById('btnSaltoPrincipal').addEventListener('click', () => {
            if (!gameActive || saltando) return;
            saltando = true;
            velocidadY = 12;
            reproducirSonido(500, 'triangle', 0.1);
        });

        document.getElementById('btnAccion1').addEventListener('click', () => {
            if (!gameActive) return;
            reproducirSonido(800, 'sawtooth', 0.08);
            bullets.push({ x: mundoX + jugadorX + 25, y: jugadorY + 20 });
            let jugadorMundoX = mundoX + jugadorX;
            enemies.forEach(en => {
                if (en.hp > 0 && Math.abs(en.x - jugadorMundoX) < 90) {
                    en.hp -= 30;
                    if (en.hp <= 0) { oro += 35; document.getElementById('txtOro').textContent = oro; }
                }
            });
        });

        function dibujarPersonaje(x, y, colorBase) {
            let baseScreenY = canvas.height - 10 - y;
            ctx.fillStyle = '#ffccaa';
            ctx.fillRect(x + 4, baseScreenY - 32, 12, 11);
            ctx.fillStyle = colorBase;
            ctx.fillRect(x + 5, baseScreenY - 30, 10, 4);
            ctx.fillRect(x + 3, baseScreenY - 21, 14, 12);
            ctx.fillStyle = '#ffccaa';
            ctx.fillRect(x - 1, baseScreenY - 19, 4, 8);
            ctx.fillRect(x + 17, baseScreenY - 19, 4, 8);
            ctx.fillStyle = '#333344';
            ctx.fillRect(x + 4, baseScreenY - 9, 5, 9);
            ctx.fillRect(x + 11, baseScreenY - 9, 5, 9);
        }

        function loop() {
            if (gameActive) {
                if (Math.abs(direccionMovimiento) > 0.1) {
                    mundoX += direccionMovimiento * 5;
                    if (mundoX < 0) mundoX = 0;
                }

                if (saltando) {
                    jugadorY += velocidadY;
                    velocidadY -= 1;
                    if (jugadorY <= 0) { jugadorY = 0; saltando = false; velocidadY = 0; }
                }

                let jugadorMundoX = mundoX + jugadorX;

                coins.forEach(c => {
                    if (!c.recolectada && Math.abs(c.x - jugadorMundoX) < 20 && Math.abs(c.y - jugadorY) < 22) {
                        c.recolectada = true;
                        oro += 15;
                        document.getElementById('txtOro').textContent = oro;
                        reproducirSonido(1200, 'sine', 0.05);
                    }
                });

                enemies.forEach(en => {
                    if (en.hp > 0) {
                        if (en.x > jugadorMundoX + 15) en.x -= en.vel;
                        else if (en.x < jugadorMundoX - 15) en.x += (en.vel * 0.5);

                        if (Math.abs(en.x - jugadorMundoX) < 16 && jugadorY <= 8) {
                            vida = Math.max(0, vida - 0.5);
                            document.getElementById('hpFill').style.width = vida + '%';
                            document.getElementById('hpText').textContent = Math.ceil(vida) + ' / 100 HP';
                            document.getElementById('efectoDaño').classList.add('recibiendo-daño');
                            setTimeout(() => document.getElementById('efectoDaño').classList.remove('recibiendo-daño'), 100);

                            if (vida <= 0) {
                                gameActive = false;
                                alert("¡Has sido derrotado en la partida online!");
                                document.getElementById('screenMultiplayer').classList.remove('oculto');
                            }
                        }
                    }
                });

                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#ffaa00';
                ctx.fillRect(0, canvas.height - 4, canvas.width, 4);

                obstacles.forEach(b => {
                    let screenX = b.x - mundoX;
                    if (screenX > -50 && screenX < canvas.width + 50) {
                        ctx.fillStyle = '#A0522D';
                        ctx.fillRect(screenX, canvas.height - 26 - b.y, b.w, b.h);
                        ctx.font = '11px sans-serif';
                        ctx.fillText(b.icono, screenX + 8, canvas.height - 10 - b.y);
                    }
                });

                coins.forEach(c => {
                    if (!c.recolectada) {
                        let screenX = c.x - mundoX;
                        if (screenX > -25 && screenX < canvas.width + 25) {
                            ctx.beginPath();
                            ctx.arc(screenX, canvas.height - 12 - c.y, 5, 0, Math.PI * 2);
                            ctx.fillStyle = '#ffff00';
                            ctx.fill();
                        }
                    }
                });

                enemies.forEach(en => {
                    if (en.hp > 0) {
                        let screenX = en.x - mundoX;
                        if (screenX > -40 && screenX < canvas.width + 40) {
                            ctx.font = '16px sans-serif';
                            ctx.fillText(en.emoji, screenX, canvas.height - 16);
                        }
                    }
                });

                dibujarPersonaje(jugadorX, jugadorY, '#ffaa00');

                if (esOnline) {
                    let compScreenX = datosCompañero.x - mundoX;
                    if (compScreenX > -40 && compScreenX < canvas.width + 40) {
                        dibujarPersonaje(compScreenX, datosCompañero.y || 0, '#00ffff');
                        ctx.fillStyle = '#00ffff';
                        ctx.font = '7px sans-serif';
                        ctx.fillText('COMPAÑERO', compScreenX - 8, canvas.height - 45 - (datosCompañero.y || 0));
                    }
                }

                ctx.fillStyle = '#ffff00';
                bullets.forEach((b, idx) => {
                    b.x += 12;
                    let screenX = b.x - mundoX;
                    ctx.fillRect(screenX, canvas.height - 24 - jugadorY, 10, 2);
                    if (b.x > mundoX + canvas.width) bullets.splice(idx, 1);
                });
            }
            requestAnimationFrame(loop);
        }

        requestAnimationFrame(loop);
    </script>
</body>
</html>
