<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmear Aura: Ultra Pro Edition</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #030303;
            color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            background-image: radial-gradient(circle at center, #151515 0%, #030303 100%);
            overflow-x: hidden;
            padding-bottom: 30px;
        }
        .main-layout {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 420px;
            padding: 15px;
        }

        /* Cabecera de Rango */
        .character-display {
            background: linear-gradient(145deg, #0d0d0d, #1a1a1a);
            border: 3px solid #d4af37;
            border-radius: 20px;
            height: 180px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.4);
        }
        
        .avatar-container {
            font-size: 75px;
            animation: floatCharacter 2s ease-in-out infinite;
            filter: drop-shadow(0 10px 10px rgba(0,0,0,0.8));
        }

        @keyframes floatCharacter {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-8px) rotate(2deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }

        .rank-tag {
            position: absolute;
            top: 10px;
            left: 10px;
            background: #d4af37;
            color: #030303;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: bold;
            text-transform: uppercase;
        }

        /* Barra de Estamina */
        .stamina-container {
            background: #111;
            border: 2px solid #333;
            border-radius: 12px;
            padding: 8px 12px;
        }
        .stamina-label {
            display: flex;
            justify-content: space-between;
            font-size: 9px;
            color: #aaa;
            margin-bottom: 4px;
            text-transform: uppercase;
        }
        .stamina-bar-bg {
            width: 100%;
            height: 10px;
            background: #222;
            border-radius: 5px;
            overflow: hidden;
            border: 1px solid #444;
        }
        .stamina-bar-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #ff3333, #00ff66);
            transition: width 0.3s linear;
        }

        /* Panel de Puntos y APS */
        .stats-panel {
            background: #111;
            border: 2px solid #444;
            border-radius: 16px;
            padding: 12px;
            text-align: center;
        }
        .aura-counter {
            font-size: 40px;
            font-weight: bold;
            color: #00ff66;
            margin: 2px 0;
            text-shadow: 0 0 10px rgba(0, 255, 102, 0.5);
        }
        .aps-text {
            font-size: 10px;
            color: #d4af37;
        }

        /* Botón Principal */
        .action-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(90deg, #ff0055, #7a00ff, #00ffcc);
            background-size: 200% 100%;
            animation: gradientAnimation 4s linear infinite;
            border: none;
            color: white;
            font-weight: bold;
            font-size: 16px;
            border-radius: 14px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 5px 20px rgba(122, 0, 255, 0.4);
        }
        .action-btn:active {
            transform: scale(0.96);
        }

        @keyframes gradientAnimation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* TIENDA INTERACTIVA */
        .shop-panel {
            background: #121212;
            border: 1px dashed #d4af37;
            border-radius: 16px;
            padding: 10px;
        }
        .shop-title {
            color: #d4af37;
            font-size: 11px;
            text-align: center;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .shop-items {
            display: flex;
            gap: 6px;
            justify-content: center;
        }
        .shop-item {
            background: #1a1a1a;
            border-radius: 8px;
            padding: 8px;
            width: 32%;
            text-align: center;
            font-size: 9px;
            border: 1px solid #444;
            cursor: not-allowed;
            opacity: 0.3;
            transition: 0.2s;
            user-select: none;
        }
        /* Estado Disponible para Comprar */
        .shop-item.available {
            opacity: 1;
            border-color: #00ff66;
            background: #112211;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0,255,102,0.4);
        }
        .shop-item.available:active {
            transform: scale(0.95);
        }
        /* Estado Comprado */
        .shop-item.bought {
            opacity: 0.85;
            border-color: #d4af37;
            background: #221d0a;
            cursor: default;
            box-shadow: none;
        }
        .shop-icon {
            font-size: 18px;
            margin-bottom: 2px;
        }

        /* Consola de Frases Sigma */
        .sigma-quote {
            background: #0a0a0a;
            border: 1px solid #222;
            border-radius: 10px;
            padding: 10px;
            text-align: center;
            font-size: 10px;
            color: #aaa;
            font-style: italic;
        }

        /* Números Flotantes */
        .floating-text {
            position: absolute;
            color: #00ff66;
            font-weight: bold;
            font-size: 16px;
            pointer-events: none;
            animation: floatUp 0.8s ease-out forwards;
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-40px) scale(1.2); }
        }
    </style>
</head>
<body>

    <div class="main-layout">
        
        <!-- PERSONAJE -->
        <div class="character-display">
            <div class="rank-tag" id="rangoEtiqueta">NPC Beta</div>
            <div class="avatar-container" id="imagenPersonaje">🧟</div>
        </div>

        <!-- ESTAMINA -->
        <div class="stamina-container">
            <div class="stamina-label">
                <span>⚡ Energía Sigma</span>
                <span id="staminaTexto">100%</span>
            </div>
            <div class="stamina-bar-bg">
                <div class="stamina-bar-fill" id="staminaBarra" style="width: 100%;"></div>
            </div>
        </div>

        <!-- PUNTOS Y APS -->
        <div class="stats-panel">
            <div class="aura-counter" id="puntosAura">0</div>
            <div class="aps-text" id="apsTexto">Generando: +0 Aura/seg</div>
        </div>

        <!-- BOTÓN PRINCIPAL -->
        <button class="action-btn" id="btnFarmear">🔥 FARMEAR AURA 🔥</button>

        <!-- TIENDA INTERACTIVA -->
        <div class="shop-panel">
            <h3 class="shop-title">Tienda de Mejoras</h3>
            <div class="shop-items">
                <div class="shop-item" id="itemLentes">
                    <div class="shop-icon">🕶️</div>
                    <p><b>Lentes</b></p>
                    <p style="color:#d4af37;" id="precioLentes">500 Aura</p>
                </div>
                <div class="shop-item" id="itemCorte">
                    <div class="shop-icon">✂️</div>
                    <p><b>Fade Pro</b></p>
                    <p style="color:#d4af37;" id="precioCorte">2,000 Aura</p>
                </div>
                <div class="shop-item" id="itemOro">
                    <div class="shop-icon">⛓️</div>
                    <p><b>Cadenita</b></p>
                    <p style="color:#d4af37;" id="precioOro">10,000 Aura</p>
                </div>
            </div>
        </div>

        <!-- CONSOLA DE FRASES -->
        <div class="sigma-quote" id="fraseSigma">
            "Un verdadero sigma no compite, domina en silencio..."
        </div>

    </div>

    <script>
        let aura = 1000; // Iniciamos con 1000 de aura temporalmente para que puedas probar la tienda de inmediato en cuanto cargues la página.
        let estamina = 100;
        let powerClick = 1;
        let auraPorSegundo = 0;

        let mejorasCompradas = { lentes: false, corte: false, oro: false };

        const btnFarmear = document.getElementById("btnFarmear");
        const puntosAura = document.getElementById("puntosAura");
        const rangoEtiqueta = document.getElementById("rangoEtiqueta");
        const imagenPersonaje = document.getElementById("imagenPersonaje");
        const staminaBarra = document.getElementById("staminaBarra");
        const staminaTexto = document.getElementById("staminaTexto");
        const apsTexto = document.getElementById("apsTexto");
        const fraseSigma = document.getElementById("fraseSigma");

        const itemLentes = document.getElementById("itemLentes");
        const itemCorte = document.getElementById("itemCorte");
        const itemOro = document.getElementById("itemOro");

        const nivelesConfig = [
            { auraMin: 0, nombre: "NPC Beta", emoji: "🧟", frase: "Sigues mirando la tele en lugar de tradear cripto." },
            { auraMin: 200, nombre: "Sigma Male", emoji: "🗿", frase: "Ignoras a todo el mundo. Tu mente está en la cima." },
            { auraMin: 800, nombre: "Gigachad 💪", emoji: "🦾", frase: "Tu mandíbula puede cortar diamantes." },
            { auraMin: 3000, nombre: "Patrick Bateman", emoji: "🕴️", frase: "Tienes que devolver unas videocintas." },
            { auraMin: 15000, nombre: "Dios del Aura", emoji: "👑", frase: "Has trascendido la realidad. Eres intocable." }
        ];

        // Bucle de Auto-Farm
        setInterval(() => {
            if (auraPorSegundo > 0) {
                aura += auraPorSegundo;
            }
            if (estamina > 0) {
                estamina -= 1;
            } else {
                if (aura > 5) aura -= 2;
            }
            actualizarJuego();
        }, 1000);

        btnFarmear.addEventListener("click", (e) => {
            let ganado = Math.floor(Math.random() * 10) + powerClick;
            aura += ganado;
            estamina += 5;
            if (estamina > 100) estamina = 100;

            actualizarJuego();
            crearTextoFlotante(e, `+${ganado}`);
        });

        // Eventos táctiles y de clic para los botones de la tienda
        itemLentes.addEventListener("click", () => {
            if (!mejorasCompradas.lentes && aura >= 500) {
                aura -= 500;
                mejorasCompradas.lentes = true;
                powerClick += 3;
                auraPorSegundo += 2;
                fraseSigma.textContent = "🕶️ Te compraste los lentes oscuros. Nadie sabe qué estás pensando.";
                actualizarJuego();
            }
        });

        itemCorte.addEventListener("click", () => {
            if (!mejorasCompradas.corte && aura >= 2000) {
                aura -= 2000;
                mejorasCompradas.corte = true;
                powerClick += 8;
                auraPorSegundo += 10;
                fraseSigma.textContent = "✂️ Corte Fade impecable. Las miradas se desvían a tu paso.";
                actualizarJuego();
            }
        });

        itemOro.addEventListener("click", () => {
            if (!mejorasCompradas.oro && aura >= 10000) {
                aura -= 10000;
                mejorasCompradas.oro = true;
                powerClick += 25;
                auraPorSegundo += 50;
                fraseSigma.textContent = "⛓️ Cadenita de oro puro desbloqueada. Aura estelar.";
                actualizarJuego();
            }
        });

        function actualizarJuego() {
            puntosAura.textContent = Math.floor(aura);
            apsTexto.textContent = `Generando: +${auraPorSegundo} Aura/seg`;
            staminaBarra.style.width = estamina + "%";
            staminaTexto.textContent = Math.floor(estamina) + "%";

            // Control visual dinámico de la tienda
            if (mejorasCompradas.lentes) {
                itemLentes.className = "shop-item bought";
                document.getElementById("precioLentes").textContent = "COMPRADO ✅";
            } else if (aura >= 500) {
                itemLentes.className = "shop-item available";
            } else {
                itemLentes.className = "shop-item";
            }

            if (mejorasCompradas.corte) {
                itemCorte.className = "shop-item bought";
                document.getElementById("precioCorte").textContent = "COMPRADO ✅";
            } else if (aura >= 2000) {
                itemCorte.className = "shop-item available";
            } else {
                itemCorte.className = "shop-item";
            }

            if (mejorasCompradas.oro) {
                itemOro.className = "shop-item bought";
                document.getElementById("precioOro").textContent = "COMPRADO ✅";
            } else if (aura >= 10000) {
                itemOro.className = "shop-item available";
            } else {
                itemOro.className = "shop-item";
            }

            // Rango Actual
            let nivelActualConfig = nivelesConfig[0];
            for (let i = 0; i < nivelesConfig.length; i++) {
                if (aura >= nivelesConfig[i].auraMin) {
                    nivelActualConfig = nivelesConfig[i];
                } else {
                    break;
                }
            }

            rangoEtiqueta.textContent = nivelActualConfig.nombre;
            imagenPersonaje.textContent = nivelActualConfig.emoji;
        }

        function crearTextoFlotante(e, texto) {
            let el = document.createElement("div");
            el.className = "floating-text";
            el.textContent = texto;
            let rect = btnFarmear.getBoundingClientRect();
            el.style.left = (rect.left + rect.width / 2 + (Math.random() * 30 - 15)) + "px";
            el.style.top = rect.top + "px";
            document.body.appendChild(el);
            setTimeout(() => { el.remove(); }, 800);
        }

        actualizarJuego();
    </script>

</body>
</html>
