<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Free Fire - Motor Canvas 60FPS (Cero Lag)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
            -webkit-tap-highlight-color: transparent;
        }
        html, body {
            width: 100%;
            height: 100vh;
            background-color: #080810;
            color: #f0f0f0;
            overflow: hidden;
            position: fixed;
            user-select: none;
        }

        #efectoDaño {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(255,0,0,0) 50%, rgba(255,0,0,0.5) 100%);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s ease;
            z-index: 999;
        }
        .recibiendo-daño { opacity: 1 !important; }

        .app-container {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 4px;
            padding: 4px;
            width: 100%;
            max-width: 500px;
            height: 100vh;
            margin: 0 auto;
            position: relative;
        }

        .top-hud-stats {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #12121c;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 10px;
            font-weight: bold;
        }

        .volume-control-box {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 8px;
            color: #ffaa00;
        }
        .volume-control-box input {
            width: 45px;
            accent-color: #ffaa00;
            cursor: pointer;
        }

        /* ARENA CANVAS */
        .battle-arena {
            flex: 1;
            display: flex;
            background: linear-gradient(135deg, rgba(20, 25, 40, 1), rgba(10, 15, 25, 1));
            border: 2px solid #ffaa00;
            border-radius: 10px;
            position: relative;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .controls-hud {
            display: flex;
            flex-direction: column;
            gap: 4px;
            background: rgba(18, 18, 28, 0.95);
            border: 1px solid #444;
            padding: 6px;
            border-radius: 10px;
        }

        .mid-controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
        }

        .joystick-base {
            width: 75px;
            height: 75px;
            background: rgba(30, 30, 50, 0.6);
            border: 2px solid rgba(255, 170, 0, 0.6);
            border-radius: 50%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
        }
        .joystick-knob {
            width: 34px;
            height: 34px;
            background: linear-gradient(135deg, #ffaa00, #ff4400);
            border: 2px solid #fff;
            border-radius: 50%;
            position: absolute;
            box-shadow: 0 3px 6px rgba(0,0,0,0.4);
            pointer-events: none;
        }

        .hp-container { flex: 1; padding: 0 4px; }
        .hp-label { font-size: 8px; color: #aaa; margin-bottom: 2px; display: flex; justify-content: space-between; }
        .hp-bar-bg { width: 100%; background: #222; height: 6px; border-radius: 3px; overflow: hidden; }
        .hp-bar-fill { width: 100%; background: linear-gradient(90deg, #ff0055, #00ff66); height: 100%; transition: width 0.1s ease; }

        .jump-action-btn {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #00ffff, #0088cc);
            border: 2px solid #fff;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            color: #000;
            font-weight: bold;
            box-shadow: 0 3px 10px rgba(0,255,255,0.4);
            cursor: pointer;
            flex-shrink: 0;
        }
        .jump-action-btn span { font-size: 7px; color: #fff; margin-top: -2px; }

        .attacks-box-hud {
            background: rgba(20, 20, 35, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            padding: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .actions-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            justify-items: center;
            width: 100%;
        }
        .round-action-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.8);
            font-size: 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(0,0,0,0.6);
        }
        .round-action-btn span { font-size: 7px; font-weight: bold; margin-top: -1px; color: #fff; }
        .locked { opacity: 0.3; filter: grayscale(100%); cursor: not-allowed; }

        #btnAccion1 { background: linear-gradient(135deg, rgba(255,0,85,0.85), rgba(255,170,0,0.85)); border-color: #ffaa00; }
        #btnAccion2 { background: linear-gradient(135deg, rgba(255,170,0,0.85), rgba(255,68,0,0.85)); border-color: #ffaa00; }
        #btnAccion3 { background: linear-gradient(135deg, rgba(0,255,102,0.85), rgba(0,150,80,0.85)); border-color: #00ff66; }
        #btnAccion4 { background: linear-gradient(135deg, rgba(138,43,226,0.85), rgba(255,0,255,0.85)); border-color: #ff00ff; }

        .info-bottom-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 8px;
            background: #141420;
            padding: 3px 6px;
            border-radius: 4px;
            border: 1px solid #333;
        }
        #chatLog { font-size: 8px; color: #00ffcc; font-style: italic; text-align: center; }
    </style>
</head>
<body>

    <div id="efectoDaño"></div>

    <div class="app-container">
        
        <div class="top-hud-stats">
            <span>🗺️ DISTANCIA: <strong id="txtDistancia" style="color:#00ffff;">0m</strong></span>
            <div class="volume-control-box">
                <span>🔊 VOL:</span>
                <input type="range" id="volRange" min="0" max="1" step="0.05" value="0.8" oninput="cambiarVolumen(this.value)">
            </div>
            <span>💎 ORO: <strong id="txtOro" style="color:#00ff66;">0</strong></span>
        </div>

        <div class="battle-arena">
            <canvas id="gameCanvas"></canvas>
        </div>

        <div class="controls-hud">
            
            <div class="mid-controls-row">
                <div class="joystick-base" id="joystickBase">
                    <div class="joystick-knob" id="joystickKnob"></div>
                </div>

                <div class="hp-container">
                    <div class="hp-label">
                        <span>❤️ VIDA (HP)</span>
                        <span id="hpText">100 HP</span>
                    </div>
                    <div class="hp-bar-bg">
                        <div class="hp-bar-fill" id="hpFill"></div>
                    </div>
                </div>

                <div class="right-controls-panel">
                    <div class="jump-action-btn" ontouchstart="saltarJugador()" onmousedown="saltarJugador()">
                        ⬆️<span id="txtBtnSalto">SALTAR</span>
                    </div>
                </div>
            </div>

            <div class="attacks-box-hud">
                <div class="actions-grid">
                    <button class="round-action-btn" id="btnAccion1" onclick="ejecutarAccion(1)">🔥<span>Fuego</span></button>
                    <button class="round-action-btn locked" id="btnAccion2" onclick="ejecutarAccion(2)">🐺<span>Lobo</span></button>
                    <button class="round-action-btn locked" id="btnAccion3" onclick="ejecutarAccion(3)">🤖<span>Mecha</span></button>
                    <button class="round-action-btn" id="btnAccion4" onclick="ejecutarAccion(4)">🦅<span>Volar</span></button>
                </div>
            </div>

            <div class="info-bottom-bar">
                <span>ESTADO: <strong id="lblEstadoTransformacion" style="color:#ffaa00;">Normal</strong></span>
                <span id="chatLog">¡Motor Canvas a 60 FPS reales!</span>
            </div>

        </div>

    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function ajustarCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', ajustarCanvas);
        ajustarCanvas();

        let vida = 100;
        let oro = 0;
        let distancia = 0;
        let mundoX = 0;
        let jugadorX = 80;
        let jugadorY = 40;
        let velocidadY = 0;
        let saltando = false;
        let volando = false;
        let tiempoVueloRestante = 0;
        let impulsoSalto = 14;
        let skinActual = { nombre: 'Alok', emoji: '🥷', color: '#ffaa00' };
        let gameActive = true;

        let boxes = [];
        let coins = [];
        let enemies = [];
        let projectiles = [];
        let bullets = [];

        // AUDIO
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const masterGain = audioCtx.createGain();
        masterGain.gain.value = 0.8;
        masterGain.connect(audioCtx.destination);

        function cambiarVolumen(v) { masterGain.gain.value = parseFloat(v); }

        function reproducirSonido(freq, tipo, dur) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = tipo;
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);
            osc.connect(gain);
            gain.connect(masterGain);
            osc.start();
            osc.stop(audioCtx.currentTime + dur);
        }

        // JOYSTICK
        const joyBase = document.getElementById('joystickBase');
        const joyKnob = document.getElementById('joystickKnob');
        let joyActive = false;
        let direccionMovimiento = 0;

        function actualizarJoystick(clientX) {
            let rect = joyBase.getBoundingClientRect();
            let centroX = rect.left + rect.width / 2;
            let deltaX = clientX - centroX;
            let radioMax = 25;
            if (deltaX > radioMax) deltaX = radioMax;
            if (deltaX < -radioMax) deltaX = -radioMax;
            joyKnob.style.transform = `translate(${deltaX}px, 0px)`;
            direccionMovimiento = deltaX / radioMax;
        }

        joyBase.addEventListener('pointerdown', (e) => { joyActive = true; actualizarJoystick(e.clientX); });
        window.addEventListener('pointermove', (e) => { if (joyActive) actualizarJoystick(e.clientX); });
        window.addEventListener('pointerup', () => { joyActive = false; direccionMovimiento = 0; joyKnob.style.transform = `translate(0px, 0px)`; });

        // INICIALIZAR MUNDO
        function generarMundo() {
            for (let i = 1; i < 400; i++) {
                let posX = i * 220 + Math.random() * 40;
                let alturaCaja = (i % 2 === 0) ? 0 : (40 + Math.random() * 70);

                boxes.push({ x: posX, y: alturaCaja, w: 45, h: 30 });

                coins.push({
                    x: posX + 20,
                    y: alturaCaja > 0 ? alturaCaja + 45 : 35 + Math.random() * 80,
                    recolectada: false
                });

                let tipos = [
                    { emoji: '🧟', tipo: 'caminante', hp: 50, color: '#ff0055', vel: 0.8 },
                    { emoji: '🤮', tipo: 'toxico', hp: 75, color: '#00ff66', vel: 0.5 },
                    { emoji: '🏺', tipo: 'momia', hp: 100, color: '#ffaa00', vel: 0.7 }
                ];
                let elegido = tipos[Math.floor(Math.random() * tipos.length)];

                enemies.push({
                    x: posX + 140 + Math.random() * 50,
                    y: 0,
                    hp: elegido.hp,
                    maxHp: elegido.hp,
                    emoji: elegido.emoji,
                    color: elegido.color,
                    vel: elegido.vel
                });
            }
        }

        function saltarJugador() {
            if (!gameActive) return;
            if (volando) {
                jugadorY = Math.min(canvas.height - 80, jugadorY + 20);
                reproducirSonido(880, 'sine', 0.08);
                return;
            }
            if (saltando) {
                impulsoSalto = Math.min(24, impulsoSalto + 4);
                velocidadY = impulsoSalto;
                reproducirSonido(750, 'triangle', 0.1);
                return;
            }
            saltando = true;
            impulsoSalto = 14;
            velocidadY = impulsoSalto;
            reproducirSonido(500, 'triangle', 0.1);
        }

        function ejecutarAccion(btn) {
            if (!gameActive) return;
            if (btn === 1) {
                reproducirSonido(800, 'sawtooth', 0.08);
                bullets.push({ x: mundoX + jugadorX + 40, y: jugadorY + 30, vida: 20 });
                let jugadorMundoX = mundoX + jugadorX;
                enemies.forEach(en => {
                    if (en.hp > 0 && Math.abs(en.x - jugadorMundoX) < 100) {
                        en.hp -= 35;
                        if (en.hp <= 0) {
                            oro += 50;
                            document.getElementById('txtOro').textContent = oro;
                        }
                    }
                });
            } else if (btn === 2 && !document.getElementById('btnAccion2').classList.contains('locked')) {
                skinActual = { nombre: 'Lobo', emoji: '🐺', color: '#ff5500' };
                document.getElementById('lblEstadoTransformacion').textContent = 'Lobo';
            } else if (btn === 3 && !document.getElementById('btnAccion3').classList.contains('locked')) {
                skinActual = { nombre: 'Mecha', emoji: '🤖', color: '#00ffcc' };
                document.getElementById('lblEstadoTransformacion').textContent = 'Mecha';
            } else if (btn === 4) {
                activarVuelo();
            }
        }

        function activarVuelo() {
            if (volando) return;
            volando = true;
            saltando = false;
            tiempoVueloRestante = 6;
            skinActual = { nombre: 'Fénix', emoji: '🦅', color: '#ff00ff' };
            document.getElementById('txtBtnSalto').textContent = 'ELEV.';
            reproducirSonido(400, 'sine', 0.4);

            let timer = setInterval(() => {
                tiempoVueloRestante--;
                document.getElementById('chatLog').textContent = `🦅 ¡Volando! Quedan ${tiempoVueloRestante}s`;
                if (tiempoVueloRestante <= 0) {
                    clearInterval(timer);
                    volando = false;
                    document.getElementById('txtBtnSalto').textContent = 'SALTAR';
                    document.getElementById('chatLog').textContent = `⚠️ Aterrizaje completado.`;
                }
            }, 1000);
        }

        // BUCLE DE RENDERIZADO CANVAS (60 FPS FLUIDOS)
        function actualizarFisicas() {
            if (!gameActive) return;

            // Movimiento lateral
            if (Math.abs(direccionMovimiento) > 0.1) {
                let velocidad = volando ? 10 : 7;
                mundoX += direccionMovimiento * velocidad;
                if (mundoX < 0) mundoX = 0;
                distancia = Math.floor(mundoX / 5);
                document.getElementById('txtDistancia').textContent = distancia + 'm';
            }

            // Desbloqueos
            if (distancia >= 100) document.getElementById('btnAccion2').classList.remove('locked');
            if (distancia >= 300) document.getElementById('btnAccion3').classList.remove('locked');

            // Salto y Gravedad
            if (saltando || volando) {
                if (volando) {
                    if (jugadorY < canvas.height - 120) jugadorY += 3;
                } else {
                    jugadorY += velocidadY;
                    velocidadY -= 1.2;

                    let jugadorMundoX = mundoX + jugadorX;
                    boxes.forEach(b => {
                        if (b.y === 0 && jugadorMundoX >= b.x - 15 && jugadorMundoX <= b.x + b.w && jugadorY <= b.h + 5 && jugadorY >= b.h - 10) {
                            jugadorY = b.h;
                            saltando = false;
                            velocidadY = 0;
                        }
                    });

                    if (jugadorY <= 0) {
                        jugadorY = 0;
                        saltando = false;
                        velocidadY = 0;
                    }
                }
            } else {
                jugadorY = 0;
            }

            let jugadorMundoX = mundoX + jugadorX;

            // Monedas
            coins.forEach(c => {
                if (!c.recolectada && Math.abs(c.x - jugadorMundoX) < 25 && Math.abs(c.y - jugadorY) < 30) {
                    c.recolectada = true;
                    oro += 20;
                    document.getElementById('txtOro').textContent = oro;
                    reproducirSonido(1200, 'sine', 0.05);
                }
            });

            // Zombis
            enemies.forEach(en => {
                if (en.hp > 0) {
                    if (en.x > jugadorMundoX + 20) en.x -= en.vel;
                    else if (en.x < jugadorMundoX - 20) en.x += (en.vel * 0.5);

                    if (Math.abs(en.x - jugadorMundoX) < 20 && jugadorY <= 10 && !volando) {
                        let daño = skinActual.nombre === 'Mecha' ? 1 : 2;
                        vida = Math.max(0, vida - daño);
                        document.getElementById('hpFill').style.width = vida + '%';
                        document.getElementById('hpText').textContent = vida + ' HP';
                    }

                    if (Math.abs(en.x - jugadorMundoX) < 200 && Math.random() < 0.01) {
                        projectiles.push({ x: en.x, y: 30, vx: -3 });
                    }
                }
            });

            // Proyectiles enemigos
            projectiles.forEach((p, idx) => {
                p.x += p.vx;
                if (Math.abs(p.x - jugadorMundoX) < 18 && jugadorY < 30 && !volando) {
                    if (skinActual.nombre !== 'Mecha') {
                        vida = Math.max(0, vida - 10);
                        document.getElementById('hpFill').style.width = vida + '%';
                        document.getElementById('hpText').textContent = vida + ' HP';
                        let ov = document.getElementById('efectoDaño');
                        ov.classList.add('recibiendo-daño');
                        setTimeout(() => ov.classList.remove('recibiendo-daño'), 150);
                    }
                    projectiles.splice(idx, 1);
                } else if (p.x < mundoX - 50) {
                    projectiles.splice(idx, 1);
                }
            });
        }

        function dibujarJuego() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Suelo base
            ctx.fillStyle = '#ffaa00';
            ctx.fillRect(0, canvas.height - 10, canvas.width, 10);

            // Dibujar Cajas
            boxes.forEach(b => {
                let screenX = b.x - mundoX;
                if (screenX > -60 && screenX < canvas.width + 60) {
                    ctx.fillStyle = '#A0522D';
                    ctx.fillRect(screenX, canvas.height - 40 - b.y, b.w, b.h);
                    ctx.font = '14px sans-serif';
                    ctx.fillText('📦', screenX + 12, canvas.height - 18 - b.y);
                }
            });

            // Dibujar Monedas
            coins.forEach(c => {
                if (!c.recolectada) {
                    let screenX = c.x - mundoX;
                    if (screenX > -30 && screenX < canvas.width + 30) {
                        ctx.beginPath();
                        ctx.arc(screenX, canvas.height - 20 - c.y, 9, 0, Math.PI * 2);
                        ctx.fillStyle = '#ffff00';
                        ctx.fill();
                        ctx.lineWidth = 2;
                        ctx.strokeStyle = '#fff';
                        ctx.stroke();
                        ctx.font = '9px sans-serif';
                        ctx.fillText('🪙', screenX - 5, canvas.height - 17 - c.y);
                    }
                }
            });

            // Dibujar Zombis
            enemies.forEach(en => {
                if (en.hp > 0) {
                    let screenX = en.x - mundoX;
                    if (screenX > -50 && screenX < canvas.width + 50) {
                        ctx.font = '20px sans-serif';
                        ctx.fillText(en.emoji, screenX, canvas.height - 25);
                        ctx.fillStyle = en.color;
                        ctx.font = '8px Courier New';
                        ctx.fillText(`HP:${en.hp}`, screenX - 5, canvas.height - 10);
                    }
                }
            });

            // Dibujar Proyectiles zombis
            ctx.fillStyle = '#00ff66';
            projectiles.forEach(p => {
                let screenX = p.x - mundoX;
                ctx.beginPath();
                ctx.arc(screenX, canvas.height - 35, 6, 0, Math.PI * 2);
                ctx.fill();
            });

            // Dibujar Balas jugador
            ctx.fillStyle = '#ffff00';
            bullets.forEach((b, idx) => {
                b.x += 15;
                let screenX = b.x - mundoX;
                ctx.fillRect(screenX, canvas.height - 40 - jugadorY, 15, 3);
                if (b.x > mundoX + canvas.width) bullets.splice(idx, 1);
            });

            // Dibujar Jugador Principal
            let playerScreenY = canvas.height - 65 - jugadorY;
            ctx.font = '24px sans-serif';
            ctx.fillText(skinActual.emoji, jugadorX, playerScreenY);
            ctx.fillStyle = skinActual.color;
            ctx.fillRect(jugadorX + 4, playerScreenY + 10, 16, 16);
            ctx.fillStyle = '#00ffff';
            ctx.font = '8px Courier New';
            ctx.fillText(skinActual.nombre, jugadorX - 4, playerScreenY + 32);
        }

        function loop() {
            actualizarFisicas();
            dibujarJuego();
            requestAnimationFrame(loop);
        }

        document.getElementById('hpFill').style.width = vida + '%';
        generarMundo();
        requestAnimationFrame(loop);
    </script>
</body>
</html>
