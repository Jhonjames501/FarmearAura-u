<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batalla de Aura - Edición Duelo 1v1</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #030303;
            color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            background-image: radial-gradient(circle at center, #151515 0%, #030303 100%);
            padding-bottom: 25px;
        }
        .main-layout {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 420px;
            padding: 12px;
        }
        .card {
            background: #111;
            border: 2px solid #d4af37;
            border-radius: 12px;
            padding: 12px;
            text-align: center;
        }
        h2 { color: #d4af37; font-size: 12px; margin-bottom: 6px; text-transform: uppercase; }
        input {
            width: 100%;
            padding: 8px;
            background: #222;
            border: 1px solid #444;
            color: #fff;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 6px;
            text-align: center;
            letter-spacing: 2px;
        }
        .menu-modes {
            display: flex;
            gap: 5px;
            margin-bottom: 8px;
        }
        .mode-btn {
            flex: 1;
            background: #1a1a1a;
            border: 1px solid #d4af37;
            color: #d4af37;
            padding: 6px;
            font-size: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .mode-btn.active {
            background: #d4af37;
            color: #030303;
        }

        /* Contenedor central del duelo idéntico a la referencia */
        .duel-container {
            background: #151515;
            border: 2px solid #ff0055;
            border-radius: 12px;
            padding: 12px;
            position: relative;
        }
        .lightning-box {
            font-size: 40px;
            margin: 2px 0 8px 0;
            color: #ffcc00;
        }
        
        /* Tarjetas de Puntuación de los Jugadores estilo meme */
        .player-score-box {
            background: #111;
            border-radius: 8px;
            padding: 8px 12px;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #444;
        }
        .box-p1 { border-color: #00ff66; }
        .box-p2 { border-color: #ff0055; }
        
        .player-title { font-size: 11px; text-align: left; }
        .box-p1 .player-title { color: #00ff66; }
        .box-p2 .player-title { color: #ff0055; }
        
        .player-points { font-size: 18px; font-weight: bold; }
        .box-p1 .player-points { color: #00ff66; }
        .box-p2 .player-points { color: #ff0055; }

        /* Botones de Toque Inferiores */
        .action-buttons-container {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }
        .action-btn {
            flex: 1;
            padding: 12px 6px;
            border: none;
            font-weight: bold;
            border-radius: 8px;
            font-size: 10px;
            cursor: pointer;
            text-transform: uppercase;
            color: white;
            box-shadow: 0 3px 10px rgba(0,0,0,0.5);
        }
        .btn-p1-touch { background: #00ff66; color: #030303; }
        .btn-p2-touch { background: #ff0055; }
        .action-btn:active { transform: scale(0.95); }
        .action-btn:disabled { background: #333; color: #778; cursor: not-allowed; box-shadow: none; }

        .sub-status {
            font-size: 9px;
            color: #888;
            margin-top: 8px;
            font-style: italic;
        }

        @keyframes auraHit {
            0% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.08); filter: brightness(1.5); }
            100% { transform: scale(1); filter: brightness(1); }
        }
        .animar-golpe { animation: auraHit 0.15s ease-in-out; }
    </style>
</head>
<body>

    <div class="main-layout">
        
        <div class="menu-modes">
            <button class="mode-btn active" id="btnModoCPU" onclick="cambiarModo('cpu')">MODO RIVAL CPU</button>
            <button class="mode-btn" id="btnModoOnline" onclick="cambiarModo('online')">MULTIJUGADOR 1V1</button>
        </div>

        <div class="card" id="panelOnline" style="display: none;">
            <h2>🌐 Multijugador Online</h2>
            <button class="mode-btn active" style="width:100%; padding: 8px; margin-bottom: 4px;" id="crearSalaBtn">Generar mi Código</button>
            <p id="myIdText" style="font-size: 11px; color: #00ff66; font-weight: bold; margin: 4px 0;">Código: ------</p>
            <input type="text" id="codigoRivalInput" placeholder="Código de tu amigo" maxlength="6">
            <button class="mode-btn" style="width:100%; padding: 8px; background: #ff0055; color:white; border-color:#ff0055;" id="unirseSalaBtn">Conectarme</button>
            <p id="connectionStatus" style="font-size: 9px; color: #aaa; margin-top: 2px;">Estado: Desconectado</p>
        </div>

        <div class="duel-container">
            <div style="font-size: 9px; color: #d4af37; letter-spacing: 1px;">⚡ DUELO DE AURA 1V1 ⚡</div>
            
            <div class="lightning-box">⚡</div>

            <div class="player-score-box box-p1" id="cardP1">
                <div class="player-title">Jugador 1 (Tú) :</div>
                <div class="player-points" id="scoreP1">0</div>
            </div>

            <div class="player-score-box box-p2" id="cardP2">
                <div class="player-title" id="labelRival">Jugador 2 (Rival) :</div>
                <div class="player-points" id="scoreP2">0</div>
            </div>

            <div class="action-buttons-container">
                <button class="action-btn btn-p1-touch" id="btnTocarP1">¡JUGADOR 1 TOCA!</button>
                <button class="action-btn btn-p2-touch" id="btnTocarP2">¡JUGADOR 2 TOCA!</button>
            </div>

            <div class="sub-status" id="statusText">El rival bot está farmeando en silencio... ¡No te dejes ganar!</div>
        </div>

    </div>

    <script>
        let modoJuego = 'cpu'; // 'cpu' o 'online'
        let score1 = 0, score2 = 0;
        let peer, conn;
        let botInterval;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function reproducirSonido(frecuencia, tipo, duracion) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = tipo;
            osc.frequency.value = frecuencia;
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duracion);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duracion);
        }

        function cambiarModo(modo) {
            modoJuego = modo;
            reiniciarPartida();
            if(modo === 'cpu') {
                document.getElementById('btnModoCPU').classList.add('active');
                document.getElementById('btnModoOnline').classList.remove('active');
                document.getElementById('panelOnline').style.display = 'none';
                document.getElementById('labelRival').textContent = "Jugador 2 (CPU) :";
                document.getElementById('statusText').textContent = "Modo CPU activado. ¡Farmea rápido!";
                iniciarBot();
            } else {
                document.getElementById('btnModoOnline').classList.add('active');
                document.getElementById('btnModoCPU').classList.remove('active');
                document.getElementById('panelOnline').style.display = 'block';
                document.getElementById('labelRival').textContent = "Jugador 2 (Online) :";
                document.getElementById('statusText').textContent = "Conéctate por código con un amigo.";
                if(botInterval) clearInterval(botInterval);
            }
        }

        // Lógica Bot CPU
        function iniciarBot() {
            if(botInterval) clearInterval(botInterval);
            botInterval = setInterval(() => {
                if(modoJuego === 'cpu' && score1 < 50 && score2 < 50) {
                    if(Math.random() > 0.4) {
                        score2 += 1;
                        document.getElementById("scoreP2").textContent = score2;
                        let c2 = document.getElementById("cardP2");
                        c2.classList.add("animar-golpe");
                        setTimeout(() => c2.classList.remove("animar-golpe"), 150);
                        verificarGanador();
                    }
                }
            }, 800);
        }

        // Toque Jugador 1
        document.getElementById("btnTocarP1").addEventListener("click", () => {
            score1 += 1;
            document.getElementById("scoreP1").textContent = score1;
            reproducirSonido(400, 'square', 0.08);
            let c1 = document.getElementById("cardP1");
            c1.classList.add("animar-golpe");
            setTimeout(() => c1.classList.remove("animar-golpe"), 150);

            if(modoJuego === 'online' && conn && conn.open) {
                conn.send({ score: score1 });
            }
            verificarGanador();
        });

        // Toque Jugador 2 (Funciona en modo local/dispositivo compartido o para recibir datos)
        document.getElementById("btnTocarP2").addEventListener("click", () => {
            if(modoJuego === 'cpu') {
                score2 += 1; // En CPU permite interactuar si juegan dos en el mismo celu
                document.getElementById("scoreP2").textContent = score2;
                reproducirSonido(300, 'sawtooth', 0.08);
                let c2 = document.getElementById("cardP2");
                c2.classList.add("animar-golpe");
                setTimeout(() => c2.classList.remove("animar-golpe"), 150);
                verificarGanador();
            }
        });

        function verificarGanador() {
            if (score1 >= 50) {
                reproducirSonido(800, 'sine', 0.4);
                alert("¡Jugador 1 gana la batalla de aura!");
                reiniciarPartida();
            } else if (score2
