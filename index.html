<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmear Aura: Multijugador Online</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #030303;
            color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            background-image: radial-gradient(circle at center, #151515 0%, #030303 100%);
            padding-bottom: 30px;
        }
        .main-layout {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 420px;
            padding: 15px;
        }
        .card {
            background: #111;
            border: 2px solid #d4af37;
            border-radius: 14px;
            padding: 15px;
            text-align: center;
        }
        h2 { color: #d4af37; font-size: 15px; margin-bottom: 10px; }
        input {
            width: 100%;
            padding: 12px;
            background: #222;
            border: 1px solid #444;
            color: #fff;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 10px;
            text-align: center;
            letter-spacing: 2px;
        }
        .btn {
            width: 100%;
            padding: 14px;
            background: #d4af37;
            color: #030303;
            border: none;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 13px;
        }
        .btn-green { background: #00ff66; }
        .btn-pink { background: #ff0055; color: white; }
        
        /* Estilos originales de la dinámica de juego */
        .game-arena {
            display: none;
            flex-direction: column;
            gap: 12px;
        }
        .status-box {
            border: 1px dashed #ff0055;
            border-radius: 12px;
            padding: 12px;
            background: #090909;
        }
        .player-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #181818;
            border: 1px solid #333;
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 13px;
        }
        .player-row.p1 { border-color: #00ff66; color: #00ff66; }
        .player-row.p2 { border-color: #ff0055; color: #ff0055; }
        
        .action-btn {
            width: 100%;
            padding: 22px;
            border: none;
            font-weight: bold;
            border-radius: 10px;
            font-size: 15px;
            cursor: pointer;
            text-transform: uppercase;
        }
        .btn-toca-1 { background: #00ff66; color: #030303; display: none; }
        .btn-toca-2 { background: #ff0055; color: #ffffff; display: block; }

        .dynamic-msg {
            font-size: 10px;
            color: #888;
            font-style: italic;
            text-align: center;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="main-layout">
        
        <!-- PANTALLA 1: LOBBY DE CONEXIÓN DE 6 DÍGITOS -->
        <div class="card" id="lobbyScreen">
            <h2>🌐 MULTIJUGADOR ONLINE</h2>
            <p style="font-size: 10px; color: #ccc; margin-bottom: 12px;">Crea tu sala o escribe el código de 6 dígitos de tu amigo.</p>
            
            <button class="btn btn-green" id="crearSalaBtn">Generar mi Código</button>
            <p id="myIdText" style="font-size: 13px; color: #00ff66; font-weight: bold; margin: 10px 0;">Código: ------</p>
            
            <hr style="border: 0.5px solid #333; margin: 12px 0;">
            
            <input type="text" id="codigoRivalInput" placeholder="Ej: 482910" maxlength="6">
            <button class="btn btn-pink" id="unirseSalaBtn">Conectarme a la Sala</button>
            <p id="connectionStatus" style="font-size: 11px; color: #aaa; margin-top: 8px;"></p>
        </div>

        <!-- PANTALLA 2: DINÁMICA DE JUEGO ORIGINAL -->
        <div class="game-arena" id="gameScreen">
            <div class="card" style="border-color: #ff0055;">
                <h2>⚡ DUELO 1V1 EN LÍNEA ⚡</h2>
                
                <div class="status-box">
                    <div class="player-row p1">
                        <span>Jugador 1 (Tú):</span>
                        <b id="scoreP1">0</b>
                    </div>
                    <div class="player-row p2">
                        <span>Jugador 2 (Rival):</span>
                        <b id="scoreP2">0</b>
                    </div>
                </div>

                <!-- Botones de dinámica originales -->
                <div style="margin-top: 12px;">
                    <button class="action-btn btn-toca-1" id="btnTocaTuyo">¡TOCA TÚ RÁPIDO!</button>
                    <button class="action-btn btn-toca-2" id="btnTocaEsperar" disabled>TURNO DEL RIVAL...</button>
                </div>

                <div class="dynamic-msg" id="dynamicMsg">Esperando acción en la red...</div>
            </div>
        </div>

    </div>

    <script>
        let peer;
        let conn;
        let score1 = 0;
        let score2 = 0;
        let codigoPersonal = "";
        let esMiTurno = true; // Turnos alternados o competencia libre

        const lobbyScreen = document.getElementById("lobbyScreen");
        const gameScreen = document.getElementById("gameScreen");
        const myIdText = document.getElementById("myIdText");
        const codigoRivalInput = document.getElementById("codigoRivalInput");
        const crearSalaBtn = document.getElementById("crearSalaBtn");
        const unirseSalaBtn = document.getElementById("unirseSalaBtn");
        
        const scoreP1 = document.getElementById("scoreP1");
        const scoreP2 = document.getElementById("scoreP2");
        const btnTocaTuyo = document.getElementById("btnTocaTuyo");
        const btnTocaEsperar = document.getElementById("btnTocaEsperar");
        const dynamicMsg = document.getElementById("dynamicMsg");
        const connectionStatus = document.getElementById("connectionStatus");

        function generarCodigo6Digitos() {
            return Math.floor(100000 + Math.random() * 900000).toString();
        }

        // Crear Sala
        crearSalaBtn.addEventListener("click", () => {
            codigoPersonal = generarCodigo6Digitos();
            myIdText.textContent = "Tu Código: " + codigoPersonal;
            crearSalaBtn.disabled = true;
            crearSalaBtn.style.opacity = "0.5";

            peer = new Peer("sigma-" + codigoPersonal);

            peer.on('open', () => {
                connectionStatus.textContent = "Sala creada. Esperando rival...";
            });

            peer.on('error', () => {
                codigoPersonal = generarCodigo6Digitos();
                myIdText.textContent = "Tu Código: " + codigoPersonal;
                peer.destroy();
                peer = new Peer("sigma-" + codigoPersonal);
            });

            peer.on('connection', (connection) => {
                conn = connection;
                setupConnection();
                iniciarJuegoOnline();
            });
        });

        // Unirse a Sala
        unirseSalaBtn.addEventListener("click", () => {
            let codigoAmigo = codigoRivalInput.value.trim();
            if (codigoAmigo.length !== 6) {
                alert("El código debe tener exactamente 6 dígitos.");
                return;
            }

            if (!peer) {
                peer = new Peer();
            }

            connectionStatus.textContent = "Conectando...";

            peer.on('open', () => {
                conn = peer.connect("sigma-" + codigoAmigo);
                setupConnection();
                iniciarJuegoOnline();
            });
        });

        function setupConnection() {
            conn.on('open', () => {
                iniciarJuegoOnline();
            });

            conn.on('data', (data) => {
                // Recibimos los puntos o estado del rival
                score2 = data;
                scoreP2.textContent = score2;
                dynamicMsg.textContent = "¡El rival acaba de farmear aura!";
                verificarGanador();
            });
        }

        function iniciarJuegoOnline() {
            lobbyScreen.style.display = "none";
            gameScreen.style.display = "flex";
            btnTocaTuyo.style.display = "block";
            btnTocaEsperar.style.display = "none";
            dynamicMsg.textContent = "¡Duelo iniciado! ¡A farmear aura!";
        }

        // Dinámica de toque
        btnTocaTuyo.addEventListener("click", () => {
            score1 += 1;
            scoreP1.textContent = score1;
            dynamicMsg.textContent = "¡Farmedaste aura con éxito!";

            if (conn && conn.open) {
                conn.send(score1);
            }
            verificarGanador();
        });

        function verificarGanador() {
            if (score1 >= 30) {
                alert("¡Has ganado el duelo online!");
                reiniciar();
            } else if (score2 >= 30) {
                alert("¡El rival te ha superado!");
                reiniciar();
            }
        }

        function reiniciar() {
            score1 = 0;
            score2 = 0;
            scoreP1.textContent = 0;
            scoreP2.textContent = 0;
        }
    </script>

</body>
</html>
