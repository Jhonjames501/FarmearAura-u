<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmear Aura: Batalla Real</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #030303;
            color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            background-image: radial-gradient(circle at center, #151515 0%, #030303 100%);
            padding-bottom: 30px;
        }
        .main-layout {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 420px;
            padding: 15px;
        }
        .card {
            background: #111;
            border: 2px solid #d4af37;
            border-radius: 14px;
            padding: 15px;
            text-align: center;
        }
        h2 { color: #d4af37; font-size: 14px; margin-bottom: 8px; text-transform: uppercase; }
        input {
            width: 100%;
            padding: 10px;
            background: #222;
            border: 1px solid #444;
            color: #fff;
            border-radius: 8px;
            font-size: 15px;
            margin-bottom: 8px;
            text-align: center;
            letter-spacing: 2px;
        }
        .btn {
            width: 100%;
            padding: 10px;
            background: #d4af37;
            color: #030303;
            border: none;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 11px;
        }
        .btn-green { background: #00ff66; }
        .btn-pink { background: #ff0055; color: white; }

        /* --- ANIMACIONES DE BATALLA REALES PARA EL PERSONAJE --- */
        .npc-box {
            font-size: 50px;
            margin: 10px 0;
            transition: transform 0.1s ease;
            display: inline-block;
        }

        /* Animación cuando golpeas (Efecto de carga de poder / golpe crítico) */
        @keyframes auraHit {
            0% { transform: scale(1) rotate(0deg); filter: drop-shadow(0 0 0px #00ff66); }
            50% { transform: scale(1.25) rotate(-5deg); filter: drop-shadow(0 0 20px #00ff66) brightness(1.5); }
            100% { transform: scale(1) rotate(0deg); filter: drop-shadow(0 0 5px #00ff66); }
        }
        .animar-golpe {
            animation: auraHit 0.25s ease-in-out;
        }

        /* Animación de vibración constante de poder (Modo Aura Activa) */
        @keyframes powerVibrate {
            0% { transform: translate(0, 0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(2px, -2px); }
            60% { transform: translate(-1px, -1px); }
            80% { transform: translate(1px, 1px); }
            100% { transform: translate(0, 0); }
        }
        .animar-vibracion {
            animation: powerVibrate 0.15s infinite;
        }

        .energy-container {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 10px;
            text-align: left;
        }
        .energy-label { font-size: 10px; color: #aaa; margin-bottom: 5px; display: flex; justify-content: space-between; }
        .energy-bar-bg { width: 100%; background: #333; height: 10px; border-radius: 5px; overflow: hidden; }
        .energy-bar-fill { width: 85%; background: linear-gradient(90deg, #ffcc00, #00ff66); height: 100%; transition: width 0.2s; }

        .score-display {
            background: #1a1a1a;
            border: 1px solid #444;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
        }
        .score-number { font-size: 26px; color: #00ff66; font-weight: bold; }
        .score-title { font-size: 10px; color: #aaa; text-transform: uppercase; margin-top: 4px; }

        .action-btn {
            width: 100%;
            padding: 18px;
            border: none;
            font-weight: bold;
            border-radius: 12px;
            font-size: 15px;
            cursor: pointer;
            text-transform: uppercase;
            background: linear-gradient(90deg, #ff0055, #7a00ff, #00ffcc);
            color: white;
            box-shadow: 0 4px 15px rgba(122, 0, 255, 0.4);
            margin-bottom: 10px;
        }
        .action-btn:active { transform: scale(0.94); }

        .store-box {
            display: flex;
            justify-content: space-between;
            gap: 5px;
            background: #1a1a1a;
            border: 1px dashed #555;
            padding: 8px;
            border-radius: 10px;
            font-size: 10px;
            color: #aaa;
        }
        .store-item { background: #222; padding: 6px; border-radius: 6px; flex: 1; text-align: center; border: 1px solid #333; }
        
        .multiplayer-status { font-size: 10px; color: #00ff66; margin-top: 5px; font-style: italic; }

        /* Texto flotante de impacto de aura */
        .aura-flotante {
            position: absolute;
            color: #00ff66;
            font-weight: bold;
            font-size: 16px;
            pointer-events: none;
            animation: subirTexto 0.6s ease-out forwards;
        }
        @keyframes subirTexto {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-40px) scale(1.3); }
        }
    </style>
</head>
<body>

    <div class="main-layout">
        
        <div class="card">
            <h2>🌐 Multijugador Online</h2>
            <button class="btn btn-green" id="crearSalaBtn">Generar mi Código</button>
            <p id="myIdText" style="font-size: 12px; color: #00ff66; font-weight: bold; margin: 6px 0;">Código: ------</p>
            
            <hr style="border: 0.5px solid #333; margin: 8px 0;">
            
            <input type="text" id="codigoRivalInput" placeholder="Código de tu amigo" maxlength="6">
            <button class="btn btn-pink" id="unirseSalaBtn">Conectarme</button>
            <p id="connectionStatus" style="font-size: 10px; color: #aaa; margin-top: 4px;">Estado: Desconectado</p>
        </div>

        <div class="card" style="border-color: #ff0055; position: relative;">
            <h2>NPC Beta</h2>
            
            <div id="npcContenedor">
                <div class="npc-box" id="npcAvatar">🧟</div>
            </div>

            <div class="energy-container">
                <div class="energy-label">
                    <span>⚡ ENERGÍA / VIDA REALISTA</span>
                    <span id="energyText">85%</span>
                </div>
                <div class="energy-bar-bg">
                    <div class="energy-bar-fill" id="energyFill"></div>
                </div>
            </div>

            <div class="score-display">
                <div class="score-number" id="scoreP1">0</div>
                <div class="score-title">Tus Puntos de Aura</div>
                <hr style="border:0.5px solid #333; margin: 8px 0;">
                <div style="font-size: 14px; color: #ff0055; font-weight: bold;" id="scoreP2">0</div>
                <div class="score-title">Puntos del Rival</div>
            </div>

            <button class="action-btn" id="btnFarmear">🔥 Farmear Aura 🔥</button>

            <div class="store-box">
                <div class="store-item">👓 Lentes (500)</div>
                <div class="store-item">✂️ Corte (7k)</div>
                <div class="store-item">🧬 Gym (15k)</div>
            </div>

            <div class="multiplayer-status" id="multiplayerStatus">¡Listo para la batalla de aura real!</div>
        </div>

    </div>

    <script>
        let peer;
        let conn;
        let score1 = 0;
        let score2 = 0;
        let energia = 85;
        let codigoPersonal = "";

        const myIdText = document.getElementById("myIdText");
        const codigoRivalInput = document.getElementById("codigoRivalInput");
        const crearSalaBtn = document.getElementById("crearSalaBtn");
        const unirseSalaBtn = document.getElementById("unirseSalaBtn");
        const scoreP1 = document.getElementById("scoreP1");
        const scoreP2 = document.getElementById("scoreP2");
        const btnFarmear = document.getElementById("btnFarmear");
        const energyFill = document.getElementById("energyFill");
        const energyText = document.getElementById("energyText");
        const connectionStatus = document.getElementById("connectionStatus");
        const multiplayerStatus = document.getElementById("multiplayerStatus");
        const npcAvatar = document.getElementById("npcAvatar");

        function generarCodigo6Digitos() {
            return Math.floor(100000 + Math.random() * 900000).toString();
        }

        crearSalaBtn.addEventListener("click", () => {
            codigoPersonal = generarCodigo6Digitos();
            myIdText.textContent = "Código: " + codigoPersonal;
            crearSalaBtn.disabled = true;
            crearSalaBtn.style.opacity = "0.5";

            peer = new Peer("sigma-" + codigoPersonal);

            peer.on('open', () => {
                connectionStatus.textContent = "Estado: Sala creada. Esperando rival...";
            });

            peer.on('error', () => {
                codigoPersonal = generarCodigo6Digitos();
                myIdText.textContent = "Código: " + codigoPersonal;
                peer.destroy();
                peer = new Peer("sigma-" + codigoPersonal);
            });

            peer.on('connection', (connection) => {
                conn = connection;
                setupConnection();
                connectionStatus.textContent = "Estado: ¡Rival conectado!";
                multiplayerStatus.textContent = "¡Partida multijugador activa!";
                npcAvatar.classList.add("animar-vibracion"); // Entra en modo poder constante
            });
        });

        unirseSalaBtn.addEventListener("click", () => {
            let codigoAmigo = codigoRivalInput.value.trim();
            if (codigoAmigo.length !== 6) {
                alert("El código debe tener exactamente 6 dígitos.");
                return;
            }

            if (!peer) {
                peer = new Peer();
            }

            connectionStatus.textContent = "Estado: Conectando...";

            peer.on('open', () => {
                conn = peer.connect("sigma-" + codigoAmigo);
                setupConnection();
            });
        });

        function setupConnection() {
            conn.on('open', () => {
                connectionStatus.textContent = "Estado: ¡Conectado con éxito!";
                multiplayerStatus.textContent = "¡Partida multijugador activa!";
                npcAvatar.classList.add("animar-vibracion");
            });

            conn.on('data', (data) => {
                score2 = data;
                scoreP2.textContent = score2;
                // Si el rival ataca, hacemos que parpadee levemente
                npcAvatar.classList.add("animar-golpe");
                setTimeout(() => npcAvatar.classList.remove("animar-golpe"), 250);
                verificarGanador();
            });

            conn.on('error', () => {
                connectionStatus.textContent = "Estado: Error de conexión.";
            });
        }

        // ACCIÓN DE FARMEAR CON ANIMACIÓN DE GOLPE Y TEXTO FLOTANTE
        btnFarmear.addEventListener("click", (e) => {
            score1 += 1;
            scoreP1.textContent = score1;

            // 1. Activar animación de golpe en el personaje
            npcAvatar.classList.remove("animar-golpe");
            void npcAvatar.offsetWidth; // Reiniciar animación CSS
            npcAvatar.classList.add("animar-golpe");

            // 2. Crear texto flotante de "+1 AURA"
            crearTextoFlotante(e, "+1 AURA");

            // 3. Variar la barra de energía
            energia = Math.max(10, energia - 1);
            energyFill.style.width = energia + "%";
            energyText.textContent = energia + "%";

            // 4. Enviar datos al rival online
            if (conn && conn.open) {
                conn.send(score1);
            }
            verificarGanador();
        });

        function crearTextoFlotante(e, texto) {
            let el = document.createElement("div");
            el.className = "aura-flotante";
            el.textContent = texto;
            
            // Posicionar donde hizo clic el usuario
            let rect = btnFarmear.getBoundingClientRect();
            el.style.left = (rect.left + rect.width / 2 + (Math.random() * 30 - 15)) + "px";
            el.style.top = rect.top + "px";
            
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 600);
        }

        function verificarGanador() {
            if (score1 >= 50) {
                alert("¡Has ganado la batalla de aura!");
                reiniciar();
            } else if (score2 >= 50) {
                alert("¡Tu rival te ha ganado!");
                reiniciar();
            }
        }

        function reiniciar() {
            score1 = 0;
            score2 = 0;
            scoreP1.textContent = 0;
            scoreP2.textContent = 0;
            energia = 85;
            energyFill.style.width = "85%";
            energyText.textContent = "85%";
            npcAvatar.classList.remove("animar-vibracion");
        }
    </script>

</body>
</html>
