<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batalla de Aura: Edición Definitiva 1v1</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #030303;
            color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            background-image: radial-gradient(circle at center, #151515 0%, #030303 100%);
            padding-bottom: 30px;
        }
        .main-layout {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
            max-width: 420px;
            padding: 12px;
        }
        .card {
            background: #111;
            border: 2px solid #d4af37;
            border-radius: 12px;
            padding: 12px;
            text-align: center;
        }
        h2 { color: #d4af37; font-size: 12px; margin-bottom: 6px; text-transform: uppercase; }
        input {
            width: 100%;
            padding: 8px;
            background: #222;
            border: 1px solid #444;
            color: #fff;
            border-radius: 6px;
            font-size: 14px;
            margin-bottom: 6px;
            text-align: center;
            letter-spacing: 2px;
        }
        .btn {
            width: 100%;
            padding: 8px;
            background: #d4af37;
            color: #030303;
            border: none;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 10px;
        }
        .btn-green { background: #00ff66; }
        .btn-pink { background: #ff0055; color: white; }

        .menu-modes {
            display: flex;
            gap: 5px;
            margin-bottom: 4px;
        }
        .mode-btn {
            flex: 1;
            background: #1a1a1a;
            border: 1px solid #d4af37;
            color: #d4af37;
            padding: 6px;
            font-size: 10px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .mode-btn.active { background: #d4af37; color: #030303; }

        /* Selector de avatares */
        .avatar-selector {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-bottom: 6px;
        }
        .avatar-opcion {
            font-size: 18px;
            background: #222;
            border: 1px solid #444;
            padding: 4px 6px;
            border-radius: 6px;
            cursor: pointer;
        }
        .avatar-opcion.activo { border-color: #00ff66; background: #152215; }

        .npc-box {
            font-size: 35px;
            margin: 2px 0;
            display: inline-block;
        }

        @keyframes auraHit {
            0% { transform: scale(1); filter: brightness(1); }
            50% { transform: scale(1.12); filter: brightness(1.6); }
            100% { transform: scale(1); filter: brightness(1); }
        }
        .animar-golpe { animation: auraHit 0.15s ease-in-out; }

        .energy-container {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 6px;
            margin-bottom: 6px;
            text-align: left;
        }
        .energy-label { font-size: 9px; color: #aaa; margin-bottom: 3px; display: flex; justify-content: space-between; }
        .energy-bar-bg { width: 100%; background: #333; height: 6px; border-radius: 3px; overflow: hidden; }
        .energy-bar-fill { width: 100%; background: linear-gradient(90deg, #ffcc00, #00ff66); height: 100%; }

        /* Estilo tipo video de duelo */
        .duel-container {
            background: #151515;
            border: 2px solid #ff0055;
            border-radius: 12px;
            padding: 10px;
        }
        .player-score-box {
            background: #111;
            border-radius: 8px;
            padding: 6px 10px;
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #444;
        }
        .box-p1 { border-color: #00ff66; }
        .box-p2 { border-color: #ff0055; }
        .player-title { font-size: 10px; }
        .box-p1 .player-title { color: #00ff66; }
        .box-p2 .player-title { color: #ff0055; }
        .player-points { font-size: 16px; font-weight: bold; }
        .box-p1 .player-points { color: #00ff66; }
        .box-p2 .player-points { color: #ff0055; }

        .action-btn {
            width: 100%;
            padding: 12px;
            border: none;
            font-weight: bold;
            border-radius: 10px;
            font-size: 12px;
            cursor: pointer;
            text-transform: uppercase;
            background: linear-gradient(90deg, #ff0055, #7a00ff, #00ffcc);
            color: white;
            box-shadow: 0 3px 10px rgba(122, 0, 255, 0.4);
            margin-bottom: 5px;
        }
        .action-btn:active { transform: scale(0.95); }
        .action-btn:disabled { background: #444; color: #888; box-shadow: none; cursor: not-allowed; }

        .special-btn {
            width: 100%;
            padding: 8px;
            background: linear-gradient(90deg, #d4af37, #ff8800);
            color: #030303;
            border: none;
            font-weight: bold;
            border-radius: 6px;
            font-size: 10px;
            cursor: pointer;
            text-transform: uppercase;
            margin-bottom: 6px;
        }
        .special-btn:disabled { background: #333; color: #666; cursor: not-allowed; }

        .store-box {
            display: flex;
            justify-content: space-between;
            gap: 4px;
            background: #1a1a1a;
            border: 1px dashed #555;
            padding: 5px;
            border-radius: 8px;
            font-size: 8px;
            margin-bottom: 6px;
        }
        .store-item { 
            background: #222; 
            padding: 5px 3px; 
            border-radius: 5px; 
            flex: 1; 
            text-align: center; 
            border: 1px solid #333; 
            cursor: pointer;
            color: #ccc;
        }
        .store-item:hover { border-color: #d4af37; color: #fff; }

        .chat-container {
            background: #111;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 5px;
            margin-top: 5px;
        }
        .chat-burlas { display: flex; gap: 3px; margin-top: 3px; }
        .chat-btn {
            background: #222;
            border: 1px solid #444;
            color: #ddd;
            font-size: 8px;
            padding: 3px;
            border-radius: 3px;
            flex: 1;
            cursor: pointer;
        }
        #chatLog { font-size: 9px; color: #ffcc00; margin-top: 2px; font-style: italic; }
    </style>
</head>
<body>

    <div class="main-layout">
        
        <div class="menu-modes">
            <button class="mode-btn active" id="btnModoCPU" onclick="cambiarModo('cpu')">MODO VS BOT</button>
            <button class="mode-btn" id="btnModoOnline" onclick="cambiarModo('online')">MULTIJUGADOR 1V1</button>
        </div>

        <div class="card" id="panelOnline" style="display: none;">
            <h2>🌐 Multijugador Online</h2>
            <button class="btn btn-green" id="crearSalaBtn" style="margin-bottom:4px;">Generar mi Código</button>
            <p id="myIdText" style="font-size: 11px; color: #00ff66; font-weight: bold; margin: 4px 0;">Código: ------</p>
            <input type="text" id="codigoRivalInput" placeholder="Código de tu amigo" maxlength="6">
            <button class="btn btn-pink" id="unirseSalaBtn">Conectarme</button>
            <p id="connectionStatus" style="font-size: 9px; color: #aaa; margin-top: 2px;">Estado: Desconectado</p>
        </div>

        <div class="duel-container">
            <div style="font-size: 9px; color: #d4af37; margin-bottom: 4px;">⚡ BATALLA DE AURA SUPREMA ⚡</div>
            
            <div class="avatar-selector">
                <div class="avatar-opcion activo" onclick="cambiarAvatar('🧟', this)">🧟</div>
                <div class="avatar-opcion" onclick="cambiarAvatar('🗿', this)">🗿</div>
                <div class="avatar-opcion" onclick="cambiarAvatar('🔥', this)">🔥</div>
                <div class="avatar-opcion" onclick="cambiarAvatar('⚡', this)">⚡</div>
            </div>
            
            <div class="npc-box" id="npcAvatar">🧟</div>

            <div class="energy-container">
                <div class="energy-label">
                    <span>⚡ ESTAMINA</span>
                    <span id="energyText">100%</span>
                </div>
                <div class="energy-bar-bg">
                    <div class="energy-bar-fill" id="energyFill"></div>
                </div>
            </div>

            <div class="player-score-box box-p1" id="cardP1">
                <div class="player-title">Jugador 1 (Tú) <span id="multiplicadorText">(+1)</span>:</div>
                <div class="player-points" id="scoreP1">0</div>
            </div>

            <div class="player-score-box box-p2" id="cardP2">
                <div class="player-title" id="labelRival">Jugador 2 (Bot) <span id="rivalAvatarDisplay"></span>:</div>
                <div class="player-points" id="scoreP2">0</div>
            </div>

            <button class="action-btn" id="btnFarmear">🔥 Farmear Aura 🔥</button>

            <button class="special-btn" id="btnPoder" onclick="usarPoderEspecial()">⚡ Absorción Suprema (Lista)</button>

            <div class="store-box">
                <div class="store-item" onclick="comprarMejora(500, 2, 'Lentes')">👓 Lentes<br><b>500 (x2)</b></div>
                <div class="store-item" onclick="comprarMejora(3000, 5, 'Corte')">✂️ Corte<br><b>3k (x5)</b></div>
                <div class="store-item" onclick="comprarMejora(10000, 15, 'Gym')">🧬 Gym<br><b>10k (x15)</b></div>
            </div>

            <div class="chat-container">
                <div style="font-size: 8px; color: #aaa;">💬 BURLAS RÁPIDAS:</div>
                <div class="chat-burlas">
                    <button class="chat-btn" onclick="enviarMensajeChat('¡No tienes aura! 🗿')">🗿 No aura</button>
                    <button class="chat-btn" onclick="enviarMensajeChat('¡Demasiado fácil! 🔥')">🔥 Fácil</button>
                    <button class="chat-btn" onclick="enviarMensajeChat('¡Ríndete ya! ⚡')">⚡ Ríndete</button>
                </div>
                <div id="chatLog">Listo para la batalla...</div>
            </div>
        </div>

    </div>

    <script>
        let modoJuego = 'cpu';
        let score1 = 0, score2 = 0;
        let estamina = 100;
        let multiplicador = 1;
        let estaCansado = false;
        let avatarActual = '🧟';
        let poderCargado = true;
        let peer, conn, botInterval;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function reproducirSonido(frecuencia, tipo, duracion) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = tipo;
            osc.frequency.value = frecuencia;
            gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duracion);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duracion);
        }

        function cambiarModo(modo) {
            modoJuego = modo;
            reiniciarPartida();
            if(modo === 'cpu') {
                document.getElementById('btnModoCPU').classList.add('active');
                document.getElementById('btnModoOnline').classList.remove('active');
                document.getElementById('panelOnline').style.display = 'none';
                document.getElementById('labelRival').innerHTML = `Jugador 2 (Bot) <span id="rivalAvatarDisplay"></span>:`;
                iniciarBot();
            } else {
                document.getElementById('btnModoOnline').classList.add('active');
                document.getElementById('btnModoCPU').classList.remove('active');
                document.getElementById('panelOnline').style.display = 'block';
                document.getElementById('labelRival').innerHTML = `Jugador 2 (Online) <span id="rivalAvatarDisplay"></span>:`;
                if(botInterval) clearInterval(botInterval);
            }
        }

        function cambiarAvatar(emoji, el) {
            document.querySelectorAll('.avatar-opcion').forEach(e => e.classList.remove('activo'));
            el.classList.add('activo');
            avatarActual = emoji;
            document.getElementById("npcAvatar").textContent = emoji;
            reproducirSonido(600, 'sine', 0.1);
            sincronizarDatos();
        }

        function comprarMejora(costo, multValor, nombre) {
            if (score1 >= costo) {
                score1 -= costo;
                multiplicador = multValor;
                document.getElementById("scoreP1").textContent = score1;
                document.getElementById("multiplicadorText").textContent = `(x${multiplicador})`;
                reproducirSonido(880, 'triangle', 0.3);
                alert(`¡Has comprado ${nombre}! Tu multiplicador subió a x${multiplicador}`);
                sincronizarDatos();
            } else {
                reproducirSonido(150, 'sawtooth', 0.2);
                alert("¡Te faltan puntos de aura!");
            }
        }

        function usarPoderEspecial() {
            if (!poderCargado) return;
            score1 += 25 * multiplicador;
            document.getElementById("scoreP1").textContent = score1;
            reproducirSonido(900, 'square', 0.4);
            alert("¡Absorción Suprema activada! +25 golpes instantáneos.");
            
            poderCargado = false;
            let btnPoder = document.getElementById("btnPoder");
            btnPoder.disabled = true;
            let tiempo = 10;
            let intervalo = setInterval(() => {
                btnPoder.textContent = `⏳ Recargando (${tiempo}s)...`;
                tiempo--;
                if(tiempo < 0) {
                    clearInterval(intervalo);
                    poderCargado = true;
                    btnPoder.disabled = false;
                    btnPoder.textContent = "⚡ Absorción Suprema (Lista)";
                }
            }, 1000);
            sincronizarDatos();
            verificarGanador();
        }

        function enviarMensajeChat(texto) {
            document.getElementById("chatLog").textContent = "Tú: " + texto;
            if (conn && conn.open) conn.send({ tipo: 'chat', contenido: texto });
        }

        function iniciarBot() {
            if(botInterval) clearInterval(botInterval);
            botInterval = setInterval(() => {
                if(modoJuego === 'cpu' && score1 < 100 && score2 < 100) {
                    if(Math.random() > 0.4) {
                        score2 += 1;
                        document.getElementById("scoreP2").textContent = score2;
                        let c2 = document.getElementById("cardP2");
                        c2.classList.add("animar-golpe");
                        setTimeout(() => c2.classList.remove("animar-golpe"), 150);
                        verificarGanador();
                    }
                }
            }, 700);
        }

        const btnFarmear = document.getElementById("btnFarmear");
        btnFarmear.addEventListener("click", () => {
            if (estaCansado) return;

            score1 += multiplicador;
            document.getElementById("scoreP1").textContent = score1;
            reproducirSonido(350 + (multiplicador * 15), 'square', 0.08);

            let c1 = document.getElementById("cardP1");
            c1.classList.add("animar-golpe");
            setTimeout(() => c1.classList.remove("animar-golpe"), 150);

            estamina -= 5;
            if (estamina <= 0) {
                estamina = 0;
                estaCansado = true;
                btnFarmear.disabled = true;
                btnFarmear.textContent = "💤 CANSADO (Descansando)...";
                setTimeout(() => {
                    estamina = 100;
                    estaCansado = false;
                    btnFarmear.disabled = false;
                    btnFarmear.textContent = "🔥 Farmear Aura 🔥";
                }, 2000);
            }
            document.getElementById("energyFill").style.width = estamina + "%";
            document.getElementById("energyText").textContent = estamina + "%";

            sincronizarDatos();
            verificarGanador();
        });

        function verificarGanador() {
            if (score1 >= 100) {
                reproducirSonido(800, 'sine', 0.5);
                alert("¡Has ganado la batalla de aura suprema!");
                reiniciarPartida();
            } else if (score2 >= 100) {
                reproducirSonido(120, 'sawtooth', 0.6);
                alert("¡El rival te ha humillado en aura!");
                reiniciarPartida();
            }
        }

        function reiniciarPartida() {
            score1 = 0; score2 = 0;
            document.getElementById("scoreP1").textContent = 0;
            document.getElementById("scoreP2").textContent = 0;
            estamina = 100; multiplicador = 1;
            document.getElementById("multiplicadorText").textContent = "(+1)";
        }

        // Multijugador Online (PeerJS)
        document.getElementById("crearSalaBtn").addEventListener("click", () => {
            let codigo = Math.floor(100000 + Math.random() * 900000).toString();
            document.getElementById("myIdText").textContent = "Código: " + codigo;
            peer = new Peer("auraduel-" + codigo);
            peer.on('open', () => document.getElementById("connectionStatus").textContent = "Esperando rival...");
            peer.on('connection', (c) => { conn = c; setupConnection(); });
        });

        document.getElementById("unirseSalaBtn").addEventListener("click", () => {
            let codigoAmigo = document.getElementById("codigoRivalInput").value.trim();
            if(codigoAmigo.length !== 6) { alert("Ingresa código de 6 dígitos"); return; }
            if(!peer) peer = new Peer();
            peer.on('open', () => {
                conn = peer.connect("auraduel-" + codigoAmigo);
                setupConnection();
            });
        });

        function setupConnection() {
            document.getElementById("connectionStatus").textContent = "¡Conectado con éxito!";
            conn.on('open', () => sincronizarDatos());
            conn.on('data', (data) => {
                if(data.tipo === 'chat') {
                    document.getElementById("chatLog").textContent = "Rival: " + data.contenido;
                } else if(data.score !== undefined) {
                    score2 = data.score;
                    document.getElementById("scoreP2").textContent = score2;
                    if(data.avatar) document.getElementById("rivalAvatarDisplay").textContent = `[${data.avatar}]`;
                    let c2 = document.getElementById("cardP2");
                    c2.classList.add("animar-golpe");
                    setTimeout(() => c2.classList.remove("animar-golpe"), 150);
                    verificarGanador();
                }
            });
        }

        function sincronizarDatos() {
            if (conn && conn.open) {
                conn.send({ score: score1, avatar: avatarActual });
            }
        }

        iniciarBot();
    </script>
</body>
</html>
