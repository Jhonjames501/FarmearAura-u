<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmear Aura: Todo en una Pantalla</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #030303;
            color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            background-image: radial-gradient(circle at center, #151515 0%, #030303 100%);
            padding-bottom: 30px;
        }
        .main-layout {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 420px;
            padding: 15px;
        }
        .card {
            background: #111;
            border: 2px solid #d4af37;
            border-radius: 14px;
            padding: 15px;
            text-align: center;
        }
        h2 { color: #d4af37; font-size: 15px; margin-bottom: 10px; }
        input {
            width: 100%;
            padding: 12px;
            background: #222;
            border: 1px solid #444;
            color: #fff;
            border-radius: 8px;
            font-size: 16px;
            margin-bottom: 10px;
            text-align: center;
            letter-spacing: 2px;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: #d4af37;
            color: #030303;
            border: none;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            font-size: 12px;
        }
        .btn-green { background: #00ff66; }
        .btn-pink { background: #ff0055; color: white; }
        
        .status-box {
            border: 1px dashed #ff0055;
            border-radius: 10px;
            padding: 10px;
            background: #090909;
            margin-bottom: 10px;
        }
        .player-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #181818;
            border: 1px solid #333;
            padding: 8px 10px;
            border-radius: 6px;
            margin-bottom: 6px;
            font-size: 12px;
        }
        .player-row.p1 { border-color: #00ff66; color: #00ff66; }
        .player-row.p2 { border-color: #ff0055; color: #ff0055; }
        
        .action-btn {
            width: 100%;
            padding: 20px;
            border: none;
            font-weight: bold;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            text-transform: uppercase;
            background: linear-gradient(90deg, #ff0055, #7a00ff, #00ffcc);
            color: white;
            box-shadow: 0 4px 15px rgba(122, 0, 255, 0.4);
        }
        .action-btn:active { transform: scale(0.96); }
        .dynamic-msg {
            font-size: 10px;
            color: #aaa;
            text-align: center;
            margin-top: 8px;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="main-layout">
        
        <!-- SECCIÓN 1: CONEXIÓN POR CÓDIGO DE 6 DÍGITOS -->
        <div class="card">
            <h2>🌐 CÓDIGO DE SALA (6 DÍGITOS)</h2>
            <button class="btn btn-green" id="crearSalaBtn">Generar mi Código</button>
            <p id="myIdText" style="font-size: 13px; color: #00ff66; font-weight: bold; margin: 8px 0;">Código: ------</p>
            
            <hr style="border: 0.5px solid #333; margin: 10px 0;">
            
            <input type="text" id="codigoRivalInput" placeholder="Pega el código de tu amigo" maxlength="6">
            <button class="btn btn-pink" id="unirseSalaBtn">Conectarme a la Sala</button>
            <p id="connectionStatus" style="font-size: 10px; color: #aaa; margin-top: 6px;">Estado: Desconectado</p>
        </div>

        <!-- SECCIÓN 2: DINÁMICA DE JUEGO (VISIBLE TODO EL TIEMPO) -->
        <div class="card" style="border-color: #ff0055;">
            <h2>⚡ DUELO EN VIVO ⚡</h2>
            
            <div class="status-box">
                <div class="player-row p1">
                    <span>Jugador 1 (Tú):</span>
                    <b id="scoreP1">0</b>
                </div>
                <div class="player-row p2">
                    <span>Jugador 2 (Rival):</span>
                    <b id="scoreP2">0</b>
                </div>
            </div>

            <button class="action-btn" id="btnFarmear">🔥 ¡TOCA RÁPIDO! 🔥</button>
            <div class="dynamic-msg" id="dynamicMsg">Conéctate con tu amigo para iniciar el duelo.</div>
        </div>

    </div>

    <script>
        let peer;
        let conn;
        let score1 = 0;
        let score2 = 0;
        let codigoPersonal = "";

        const myIdText = document.getElementById("myIdText");
        const codigoRivalInput = document.getElementById("codigoRivalInput");
        const crearSalaBtn = document.getElementById("crearSalaBtn");
        const unirseSalaBtn = document.getElementById("unirseSalaBtn");
        
        const scoreP1 = document.getElementById("scoreP1");
        const scoreP2 = document.getElementById("scoreP2");
        const btnFarmear = document.getElementById("btnFarmear");
        const dynamicMsg = document.getElementById("dynamicMsg");
        const connectionStatus = document.getElementById("connectionStatus");

        function generarCodigo6Digitos() {
            return Math.floor(100000 + Math.random() * 900000).toString();
        }

        // Crear Sala
        crearSalaBtn.addEventListener("click", () => {
            codigoPersonal = generarCodigo6Digitos();
            myIdText.textContent = "Código: " + codigoPersonal;
            crearSalaBtn.disabled = true;
            crearSalaBtn.style.opacity = "0.5";

            peer = new Peer("sigma-" + codigoPersonal);

            peer.on('open', () => {
                connectionStatus.textContent = "Estado: Sala creada. Esperando al rival...";
            });

            peer.on('error', () => {
                codigoPersonal = generarCodigo6Digitos();
                myIdText.textContent = "Código: " + codigoPersonal;
                peer.destroy();
                peer = new Peer("sigma-" + codigoPersonal);
            });

            peer.on('connection', (connection) => {
                conn = connection;
                setupConnection();
                connectionStatus.textContent = "Estado: ¡Rival conectado con éxito!";
                dynamicMsg.textContent = "¡Partida en curso! ¡A farmear aura!";
            });
        });

        // Unirse a Sala
        unirseSalaBtn.addEventListener("click", () => {
            let codigoAmigo = codigoRivalInput.value.trim();
            if (codigoAmigo.length !== 6) {
                alert("El código debe tener exactamente 6 dígitos.");
                return;
            }

            if (!peer) {
                peer = new Peer();
            }

            connectionStatus.textContent = "Estado: Conectando con la sala...";

            peer.on('open', () => {
                conn = peer.connect("sigma-" + codigoAmigo);
                setupConnection();
            });
        });

        function setupConnection() {
            conn.on('open', () => {
                connectionStatus.textContent = "Estado: ¡Conectado con éxito!";
                dynamicMsg.textContent = "¡Partida en curso! ¡A farmear aura!";
            });

            conn.on('data', (data) => {
                score2 = data;
                scoreP2.textContent = score2;
                verificarGanador();
            });

            conn.on('error', () => {
                connectionStatus.textContent = "Estado: Error de conexión.";
            });
        }

        // Acción de toque en la misma pantalla
        btnFarmear.addEventListener("click", () => {
            score1 += 1;
            scoreP1.textContent = score1;
            
            if (conn && conn.open) {
                conn.send(score1);
            } else {
                dynamicMsg.textContent = "Aviso: Aún no estás conectado a ningún rival.";
            }
            verificarGanador();
        });

        function verificarGanador() {
            if (score1 >= 30) {
                alert("¡Has ganado la batalla!");
                reiniciar();
            } else if (score2 >= 30) {
                alert("¡Tu rival te ha ganado!");
                reiniciar();
            }
        }

        function reiniciar() {
            score1 = 0;
            score2 = 0;
            scoreP1.textContent = 0;
            scoreP2.textContent = 0;
        }
    </script>

</body>
</html>
